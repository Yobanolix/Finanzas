<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>Wealth OS v0.6</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  color-scheme: dark;
  --bg: #08090b;
  --panel: #0d0f12;
  --panel-2: #11141a;
  --panel-3: #151922;
  --line: rgba(255, 255, 255, 0.06);
  --line-strong: rgba(255, 255, 255, 0.12);
  --text: #f5f7fb;
  --soft: #c7ccd5;
  --muted: #8b929f;
  --faint: #626b78;
  --accent: #5e90ff;
  --green: #55d58a;
  --red: #ff6b6b;
  --amber: #e7bd58;
  --radius: 8px;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter Variable", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}
button, input, select, textarea { font: inherit; font-variant-numeric: tabular-nums; letter-spacing: 0; }
button { cursor: pointer; }
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 20px; padding: 20px 16px; border-right: 0.5px solid var(--line); background: #090a0d; }
.brand { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border: 0.5px solid var(--line-strong); border-radius: 8px; color: var(--accent); font-size: 17px; font-weight: 700; }
.brand-title { display: grid; gap: 2px; line-height: 1; font-size: 14px; font-weight: 650; }
.brand-title span { color: var(--muted); font-size: 11px; font-weight: 500; }
.nav { display: grid; gap: 4px; }
.nav button { display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); text-align: left; font-size: 13px; }
.nav button:hover, .nav button.active { background: var(--panel-2); color: var(--text); }
.nav-index { color: var(--faint); font-size: 11px; }
.side-card { margin-top: auto; display: grid; gap: 10px; padding: 12px; border: 0.5px solid var(--line); border-radius: 8px; background: var(--panel); }
.side-card .side-label { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.side-card .side-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11.5px; }
.side-card .side-row strong { color: var(--text); font-weight: 650; }
.side-card .side-goal { display: grid; gap: 4px; padding-top: 4px; border-top: 0.5px solid var(--line); }
.side-card .side-goal:first-of-type { border-top: 0; padding-top: 0; }
.side-card .side-goal .gname { font-size: 11.5px; color: var(--soft); }
.side-card .side-goal .gprog { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); }
.main { min-width: 0; padding: 20px 24px 48px; }
.topbar { position: sticky; top: 0; z-index: 8; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 0 0 20px; background: var(--bg); }
.kicker { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
h1 { margin: 0; font-size: 32px; line-height: 1.08; font-weight: 720; }
h2 { margin: 0; font-size: 17px; line-height: 1.25; font-weight: 680; }
h3 { margin: 0; font-size: 14px; line-height: 1.3; font-weight: 680; }
h4 { margin: 0; font-size: 12px; line-height: 1.3; font-weight: 680; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
p { margin: 0; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.btn, .icon-btn, .chip { border: 0.5px solid var(--line-strong); border-radius: 8px; background: var(--panel-2); color: var(--text); min-height: 36px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; font-size: 13px; font-weight: 620; white-space: nowrap; }
.btn:hover, .icon-btn:hover, .chip:hover { border-color: rgba(94, 144, 255, 0.42); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #061021; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.danger { background: rgba(255, 107, 107, 0.08); border-color: rgba(255, 107, 107, 0.3); color: var(--red); }
.btn.sm { min-height: 28px; padding: 0 10px; font-size: 12px; font-weight: 600; }
.icon-btn { display: grid; place-items: center; width: 36px; padding: 0; color: var(--muted); }
.kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border: 0.5px solid var(--line-strong); border-radius: 6px; color: var(--muted); background: #0a0c10; font-size: 11px; }
.view { display: grid; gap: 16px; }
.grid { display: grid; gap: 12px; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.metric { display: grid; gap: 8px; min-height: 108px; padding: 16px; border: 0.5px solid var(--line); border-radius: 8px; background: var(--panel); }
.metric label { color: var(--muted); font-size: 12px; }
.metric strong { color: var(--text); font-size: 22px; line-height: 1.1; font-weight: 700; }
.metric small { color: var(--faint); font-size: 12px; line-height: 1.35; }
.metric.accent strong { color: var(--accent); }
.metric.good strong { color: var(--green); }
.metric.bad strong { color: var(--red); }
.metric.warn strong { color: var(--amber); }
.panel { display: grid; gap: 16px; padding: 16px; border: 0.5px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 0; }
.panel.tight { gap: 12px; padding: 14px; }
.panel-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.panel-sub { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.4; }
.stack { display: grid; gap: 8px; }
.split { display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr); gap: 16px; align-items: start; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
.row + .row { border-top: 0.5px solid var(--line); padding-top: 8px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.good { color: var(--green); }
.bad { color: var(--red); }
.warn { color: var(--amber); }
.accent { color: var(--accent); }
.badge { display: inline-flex; align-items: center; justify-content: center; min-height: 22px; padding: 0 8px; border: 0.5px solid var(--line-strong); border-radius: 999px; color: var(--soft); background: #0a0c10; font-size: 11px; white-space: nowrap; }
.badge.good { color: var(--green); border-color: rgba(85, 213, 138, 0.26); }
.badge.bad { color: var(--red); border-color: rgba(255, 107, 107, 0.26); }
.badge.warn { color: var(--amber); border-color: rgba(231, 189, 88, 0.26); }
.badge.accent { color: var(--accent); border-color: rgba(94, 144, 255, 0.3); }
.progress { display: grid; gap: 6px; }
.bar { position: relative; height: 6px; overflow: hidden; border-radius: 999px; background: #090b0f; border: 0.5px solid var(--line); }
.bar span { position: absolute; inset: 0 auto 0 0; width: var(--w, 0%); max-width: 100%; border-radius: inherit; background: var(--accent); }
.bar.green span { background: var(--green); }
.bar.red span { background: var(--red); }
.bar.amber span { background: var(--amber); }
.table-wrap { overflow-x: auto; border: 0.5px solid var(--line); border-radius: 8px; }
.table-wrap.tight { border-radius: 0; border: 0; }
table { width: 100%; min-width: 720px; border-collapse: collapse; }
table.compact-table { min-width: 0; }
th, td { padding: 10px 12px; border-bottom: 0.5px solid var(--line); text-align: left; vertical-align: middle; font-size: 12px; }
th { color: var(--muted); font-weight: 620; background: #0a0c10; }
tr:last-child td { border-bottom: 0; }
tr.row-hover { cursor: pointer; }
tr.row-hover:hover { background: rgba(94, 144, 255, 0.04); }
td.r, th.r { text-align: right; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12px; color: var(--muted); min-height: 32px; }
.chip.active { background: rgba(94, 144, 255, 0.12); border-color: rgba(94, 144, 255, 0.46); color: var(--text); }
.empty { padding: 24px; text-align: center; color: var(--faint); font-size: 12px; }
.empty .empty-title { color: var(--muted); font-size: 13px; margin-bottom: 6px; font-weight: 620; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid.cols-1 { grid-template-columns: 1fr; }
.form-grid .span-2 { grid-column: span 2; }
label.field { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
label.field .field-hint { color: var(--faint); font-size: 11px; font-weight: 400; }
input, select, textarea { width: 100%; min-height: 38px; padding: 0 10px; border: 0.5px solid var(--line-strong); border-radius: 8px; background: #090b0f; color: var(--text); outline: none; }
textarea { min-height: 110px; padding: 10px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: rgba(94, 144, 255, 0.62); }
input[type="checkbox"] { width: auto; min-height: 0; height: 16px; width: 16px; accent-color: var(--accent); }
.drawer-backdrop, .palette-backdrop { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(0, 0, 0, 0.42); }
.drawer-backdrop.open, .palette-backdrop.open { display: block; }
.drawer { position: fixed; z-index: 50; top: 0; right: 0; width: min(560px, 100vw); height: 100vh; display: grid; grid-template-rows: auto 1fr auto; transform: translateX(100%); transition: transform 120ms ease; border-left: 0.5px solid var(--line-strong); background: #090a0d; }
.drawer.open { transform: translateX(0); }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px; border-bottom: 0.5px solid var(--line); }
.drawer-body { overflow: auto; padding: 20px; display: grid; gap: 16px; align-content: start; }
.drawer-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-top: 0.5px solid var(--line); background: #090a0d; }
.drawer-foot .right { display: flex; gap: 8px; }
.sub-table { border: 0.5px solid var(--line); border-radius: 8px; overflow: hidden; }
.sub-table .sub-table-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: #0a0c10; border-bottom: 0.5px solid var(--line); }
.sub-table .sub-table-head h4 { margin: 0; }
.sub-table-rows { display: grid; }
.sub-table-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 0.5px solid var(--line); font-size: 12px; }
.sub-table-row:last-child { border-bottom: 0; }
.sub-table-row .name { color: var(--text); }
.sub-table-row .meta { color: var(--muted); font-size: 11px; }
.sub-table-row .actions { display: flex; gap: 6px; }
.sub-table-empty { padding: 16px 12px; text-align: center; color: var(--faint); font-size: 12px; }
.palette { position: fixed; z-index: 60; left: 50%; top: 12vh; width: min(640px, calc(100vw - 32px)); display: none; transform: translateX(-50%); border: 0.5px solid var(--line-strong); border-radius: 8px; background: #090a0d; }
.palette.open { display: grid; }
.palette input { border: 0; border-bottom: 0.5px solid var(--line); border-radius: 8px 8px 0 0; min-height: 52px; padding: 0 16px; background: transparent; font-size: 14px; }
.palette-list { display: grid; gap: 2px; padding: 8px; max-height: 360px; overflow-y: auto; }
.palette-section { padding: 8px 10px 4px; color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.palette-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--soft); text-align: left; font-size: 13px; }
.palette-item.active, .palette-item:hover { background: var(--panel-2); color: var(--text); }
.palette-item .desc { color: var(--faint); font-size: 11px; }
.palette-empty { padding: 24px; text-align: center; color: var(--faint); font-size: 13px; }
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 70; display: none; max-width: 360px; padding: 12px 14px; border: 0.5px solid var(--line-strong); border-radius: 8px; background: #090a0d; color: var(--text); font-size: 12.5px; }
.toast.open { display: block; }
.toast.good { color: var(--green); border-color: rgba(85, 213, 138, 0.3); }
.toast.bad { color: var(--red); border-color: rgba(255, 107, 107, 0.3); }
.drop-zone { position: fixed; inset: 12px; z-index: 80; display: none; place-items: center; border: 0.5px solid rgba(94, 144, 255, 0.62); border-radius: 8px; background: rgba(8, 9, 11, 0.88); color: var(--text); font-size: 17px; }
.drop-zone.open { display: grid; }
.confirm-bg { position: fixed; inset: 0; z-index: 90; display: none; place-items: center; background: rgba(0, 0, 0, 0.6); }
.confirm-bg.open { display: grid; }
.confirm { width: min(420px, calc(100vw - 32px)); padding: 20px; border: 0.5px solid var(--line-strong); border-radius: 8px; background: #090a0d; display: grid; gap: 16px; }
.confirm h3 { font-size: 14px; }
.confirm p { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }
/* Advanced disclosure */
.advanced-toggle { grid-column: span 2; padding-top: 4px; }
.advanced-toggle button { padding: 6px 0; background: none; border: 0; color: var(--accent); font-size: 12px; cursor: pointer; }
.advanced-toggle button:hover { color: var(--text); }
.advanced-section { grid-column: span 2; padding: 12px 14px; background: rgba(255,255,255,0.015); border: 0.5px dashed var(--line); border-radius: 8px; display: none; }
.advanced-section.open { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.advanced-section .span-2 { grid-column: span 2; }

/* TC ciclo */
.tc-card { padding: 14px 16px; border: 0.5px solid var(--line); border-radius: 8px; background: var(--panel); display: grid; gap: 10px; }
.tc-card .tc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tc-card .tc-name { font-size: 13.5px; font-weight: 620; }
.tc-card .tc-meta { font-size: 11.5px; color: var(--muted); }
.tc-bar { height: 8px; background: #090b0f; border: 0.5px solid var(--line); border-radius: 999px; overflow: hidden; position: relative; }
.tc-bar span { position: absolute; inset: 0 auto 0 0; width: var(--w, 0%); max-width: 100%; background: var(--accent); border-radius: inherit; }
.tc-bar.warn span { background: var(--amber); }
.tc-bar.bad span { background: var(--red); }
.tc-bar.good span { background: var(--green); }
.tc-detail { font-size: 12px; color: var(--soft); display: grid; gap: 4px; }
.tc-detail .tc-row { display: flex; justify-content: space-between; }
.tc-cycle-list { display: grid; gap: 4px; margin-top: 8px; padding-top: 8px; border-top: 0.5px solid var(--line); }
.tc-mov-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 0.5px solid var(--line); font-size: 12px; cursor: pointer; }
.tc-mov-row:last-child { border-bottom: 0; }
.tc-mov-row .tc-mov-date { color: var(--faint); font-size: 11px; min-width: 60px; }
.tc-mov-row .tc-mov-concept { flex: 1; }
.tc-mov-row .tc-mov-amount { color: var(--red); font-variant-numeric: tabular-nums; }
.tc-mov-empty { padding: 16px; text-align: center; color: var(--faint); font-size: 12px; }

/* Phases */
.phase-card { border: 0.5px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.phase-card h4 { color: var(--text); }
.phase-card.phase-1 { border-left: 2px solid var(--amber); }
.phase-card.phase-2 { border-left: 2px solid var(--accent); }
.phase-meta { font-size: 11px; color: var(--faint); margin-top: 2px; margin-bottom: 8px; }

@media (max-width: 1060px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; padding: 12px; border-right: 0; border-bottom: 0.5px solid var(--line); }
  .nav { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .nav button { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 8px 4px; font-size: 11.5px; }
  .nav-index { display: none; }
  .side-card { display: none; }
  .main { padding: 16px 12px 40px; }
  .split, .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  h1 { font-size: 22px; }
  .topbar { position: static; display: grid; }
  .top-actions { justify-content: flex-start; }
  .nav { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .metric { min-height: 96px; }
  .metric strong { font-size: 17px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .span-2 { grid-column: span 1; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">W</div>
      <div class="brand-title">Wealth OS <span>v0.6 personal capital</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-card" id="sideCard"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <p class="kicker" id="kicker"></p>
        <h1 id="title"></h1>
      </div>
      <div class="top-actions">
        <button class="btn ghost" type="button" data-action="open-palette"><span class="kbd">⌘K</span> Buscar</button>
        <button class="btn" type="button" data-action="open-settings">Tipos</button>
        <button class="btn primary" type="button" data-action="export-json">Respaldo</button>
      </div>
    </header>

    <section class="view" id="app"></section>
  </main>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div>
      <h2 id="drawerTitle"></h2>
      <p class="panel-sub" id="drawerSub"></p>
    </div>
    <button class="icon-btn" type="button" data-action="close-drawer" aria-label="Cerrar">Esc</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot" style="display:none;">
    <div id="drawerFootLeft"></div>
    <div class="right">
      <button class="btn ghost" type="button" data-action="close-drawer">Cancelar</button>
      <button class="btn primary" type="button" data-action="drawer-save">Guardar</button>
    </div>
  </div>
</aside>

<div class="palette-backdrop" id="paletteBackdrop"></div>
<div class="palette" id="palette" role="dialog" aria-label="Command palette">
  <input id="paletteInput" autocomplete="off" placeholder="Buscar acción, módulo o decisión">
  <div class="palette-list" id="paletteList"></div>
</div>

<div class="drop-zone" id="dropZone">Soltá un respaldo JSON para importarlo</div>
<div class="toast" id="toast"></div>

<div class="confirm-bg" id="confirmBg">
  <div class="confirm">
    <h3 id="confirmTitle">¿Confirmar?</h3>
    <p id="confirmBody">Esta acción no se puede deshacer.</p>
    <div class="confirm-actions">
      <button class="btn ghost" type="button" data-action="close-confirm">Cancelar</button>
      <button class="btn danger" type="button" id="confirmOk">Confirmar</button>
    </div>
  </div>
</div>
<script>
"use strict";

/* ============================================================
   WEALTH OS v0.4 — Slice 1
   CRUD real, schema versionado, migración v0.3 → v0.4,
   Capital full, Cashflow full, Goals transversal, Business CRUD.
   Decision Lab y Venture Lab quedan como v0.3 funcional.
   ============================================================ */

const STORE_KEY = "wealth_os_v06";
const STORE_KEY_V05 = "wealth_os_v05";
const STORE_KEY_V04 = "wealth_os_v04";
const STORE_KEY_V03 = "wealth_os_v03";
const SCHEMA_VERSION = 6;

/* ============ CONSTANTS ============ */
const ASSET_CLASSES = {
  cash:        { label: "Caja",              icon: "▢", group: "líquido" },
  fund:        { label: "Fondo mutuo",       icon: "◆", group: "inversión" },
  etf:         { label: "ETF",               icon: "◆", group: "inversión" },
  stock:       { label: "Acción",            icon: "◆", group: "inversión" },
  apv:         { label: "APV",               icon: "◉", group: "retiro" },
  deposit:     { label: "Depósito a plazo",  icon: "▢", group: "líquido" },
  real_estate: { label: "Inmobiliario",      icon: "▣", group: "real estate" },
  crypto:      { label: "Crypto",            icon: "◇", group: "inversión" },
  business:    { label: "Negocio (equity)",  icon: "◑", group: "operativo" },
  private:     { label: "Privado",           icon: "○", group: "privado" },
  other:       { label: "Otro",              icon: "·", group: "otro" },
};

const LIQUIDITY = {
  immediate:  { label: "Inmediata",   days: 0,   weight: 1.0 },

function emptyState() {
  const s = demoState();
  return {
    ...s,
    assets: [], liabilities: [], businesses: [], goals: [], decisions: [], tcMovements: [],
    cashflow: { income: [], expenses: [] },
  };
}

function ensureIds(state) {
  // Defensive: cualquier entidad sin id, le ponemos uno
  const arrs = ["assets", "liabilities", "goals", "businesses", "decisions", "tcMovements"];
  arrs.forEach(k => (state[k] || []).forEach(e => { if (!e.id) e.id = uid(k.slice(0, 3)); }));
  (state.cashflow?.income  || []).forEach(e => { if (!e.id) e.id = uid("inc"); });
  (state.cashflow?.expenses|| []).forEach(e => { if (!e.id) e.id = uid("exp"); });
  (state.businesses || []).forEach(b => {
    (b.products    || []).forEach(p => { if (!p.id) p.id = uid("p"); });
    (b.fixedCosts  || []).forEach(c => { if (!c.id) c.id = uid("fc"); });
    (b.partners    || []).forEach(p => { if (!p.id) p.id = uid("pa"); });
  });
  return state;
}

function migrateFromV03(v03) {
  // v0.3 → v0.4
  const out = JSON.parse(JSON.stringify(v03 || {}));
  out.schemaVersion = SCHEMA_VERSION;
  out.ui = out.ui || { view: "today", decision: "property", businessId: null, stress: "base" };
  out.settings = out.settings || { usd: 950, uf: 39345, reserveMonths: 6 };
  // v0.3 settings tenía usd/uf - mantener
  out.cashflow = out.cashflow || { income: [], expenses: [] };
  out.cashflow.income   = (out.cashflow.income   || []).map(e => ({ currency: "CLP", notes: "", ...e }));
  out.cashflow.expenses = (out.cashflow.expenses || []).map(e => ({ currency: "CLP", notes: "", type: e.type || "living", ...e }));
  out.assets = (out.assets || []).map(a => ({
    costBasis: null, notes: "", monthlyIncome: 0, ...a,
  }));
  out.liabilities = (out.liabilities || []).map(l => ({ notes: "", type: l.type || "other", ...l }));
  out.businesses  = (out.businesses  || []).map(b => ({
    stage: "Operación", partnerStructure: "fifty_fifty", notes: "", partners: [], ownerDraw: 0, valuationMultiple: 2.0,
    ...b,
    products:   (b.products   || []).map(p => ({ feePct: 0, ...p })),

    target: g.target != null ? g.target : 0,

}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.schemaVersion === SCHEMA_VERSION) {
        state = ensureIds(parsed);
        return { migrated: false, source: "v06" };
      }
    }
    // Try v0.5
    const v05raw = localStorage.getItem(STORE_KEY_V05);
    if (v05raw) {
      const v05 = JSON.parse(v05raw);
      state = migrateFromV05(v05);
      saveState();
      return { migrated: true, source: "v05" };
    }
    // Try v0.4
    const v04raw = localStorage.getItem(STORE_KEY_V04);
    if (v04raw) {
      const v04 = JSON.parse(v04raw);
      state = migrateFromV04(v04);
      saveState();
      return { migrated: true, source: "v04" };
    }
    // Try v0.3
    const v03raw = localStorage.getItem(STORE_KEY_V03);
    if (v03raw) {
      const v03 = JSON.parse(v03raw);
      state = migrateFromV03(v03);
      if (!Array.isArray(state.decisions)) state.decisions = [];
      if (!Array.isArray(state.tcMovements)) state.tcMovements = [];
      saveState();
      return { migrated: true, source: "v03" };
    }
    // First run: load demo
    state = ensureIds(demoState());
    saveState();
    return { migrated: false, source: "demo" };
  } catch (e) {
    console.error("loadState failed:", e);
    state = ensureIds(demoState());
    return { migrated: false, source: "demo-fallback", error: e.message };
  }
}

function saveState() {
  state.schemaVersion = SCHEMA_VERSION;
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

function assetReturnEff(a) {
  if (a.annualReturn != null && !isNaN(a.annualReturn) && a.annualReturn !== "") return Number(a.annualReturn);
  return (ASSET_DEFAULTS[a.class] || ASSET_DEFAULTS.other).annualReturn;
}
function assetLiquidityEff(a) {
  if (a.liquidity) return a.liquidity;
  return (ASSET_DEFAULTS[a.class] || ASSET_DEFAULTS.other).liquidity;
}
function assetRiskEff(a) {
  if (a.risk) return a.risk;
  return (ASSET_DEFAULTS[a.class] || ASSET_DEFAULTS.other).risk;
}

/* ============================================================
   TC CICLO helper — basado en liability type=credit_card
   ============================================================ */
function getTCs() {
  return (state.liabilities || []).filter(l => l.type === "credit_card");
}

function tcCycleRange(cutoffDay) {
  // Returns { start: Date, end: Date }
  const today = new Date();
  const d = cutoffDay || 1;
  let start;
  if (today.getDate() > d) {
    // Cycle started this month at cutoff day + 1
    start = new Date(today.getFullYear(), today.getMonth(), d + 1);
  } else {
    // Cycle started last month at cutoff day + 1
    start = new Date(today.getFullYear(), today.getMonth() - 1, d + 1);
  }
  const end = new Date(start);
  end.setMonth(end.getMonth() + 1);
  end.setDate(end.getDate() - 1);
  return { start, end };
}

function tcCycleData(liability) {
  const movs = (state.tcMovements || []).filter(m => m.liability_id === liability.id);
  if (!liability.cutoffDay) {
    return {
      cutoffDay: null, cycleStart: null, cycleEnd: null,
      cycleCharges: [], cycleTotal: 0,
      daysToCutoff: null,
      utilization: liability.creditLimit ? Math.min(1, (liability.balance || 0) / liability.creditLimit) : null,
    };
  }
  const { start, end } = tcCycleRange(liability.cutoffDay);
  const cycleCharges = movs.filter(m => {
    const dt = new Date(m.date);
    return dt >= start && dt <= end;
  }).slice().sort((a, b) => b.date.localeCompare(a.date));
  const cycleTotal = cycleCharges.reduce((s, m) => s + (m.amount || 0), 0);
  const today = new Date();
  const daysToCutoff = Math.max(0, Math.ceil((end.getTime() - today.getTime()) / 86400000));
  const utilization = liability.creditLimit ? Math.min(1, cycleTotal / liability.creditLimit) : null;
  return { cutoffDay: liability.cutoffDay, cycleStart: start, cycleEnd: end, cycleCharges, cycleTotal, daysToCutoff, utilization };
}

/* ============ FORMATTERS ============ */

const NF0 = new Intl.NumberFormat("es-CL", { maximumFractionDigits: 0 });
const NF2 = new Intl.NumberFormat("es-CL", { maximumFractionDigits: 2 });

function fmtCLP(n) {
  if (n == null || isNaN(n)) return "—";
  return "$" + NF0.format(Math.round(n));
}
function fmtShort(n) {
  if (n == null || isNaN(n)) return "—";
  const a = Math.abs(n), sign = n < 0 ? "-" : "";
  if (a >= 1e9) return sign + "$" + NF2.format(a / 1e9) + "B";
  if (a >= 1e6) return sign + "$" + NF2.format(a / 1e6) + "M";
  if (a >= 1e3) return sign + "$" + NF0.format(Math.round(a / 1e3)) + "K";
  return sign + "$" + NF0.format(a);
}
function fmtUF(n)  { if (n == null || isNaN(n)) return "—"; return NF2.format(n) + " UF"; }
function fmtUSD(n) { if (n == null || isNaN(n)) return "—"; return "US$" + NF2.format(n); }
function fmtPct(n, d = 1) { if (n == null || isNaN(n)) return "—"; return (n * 100).toFixed(d) + "%"; }
function fmtAmount(amount, currency) {
  if (amount == null || isNaN(amount)) return "—";
  if (currency === "USD") return fmtUSD(amount);
  if (currency === "UF")  return fmtUF(amount);
  return fmtCLP(amount);
}
function fmtMonths(n) {
  if (n == null || isNaN(n)) return "—";
  const a = Math.abs(n);
  if (a < 1) return "menos de 1 mes";
  if (a < 12) return `${Math.round(a)} ${Math.round(a) === 1 ? "mes" : "meses"}`;
  const y = Math.floor(a / 12), m = Math.round(a % 12);
  if (m === 0) return `${y} ${y === 1 ? "año" : "años"}`;
  return `${y}a ${m}m`;
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function monthsBetween(a, b) {
  if (!a || !b) return null;
  const da = new Date(a), db = new Date(b);
  return (db.getFullYear() - da.getFullYear()) * 12 + (db.getMonth() - da.getMonth());
}

function toCLP(amount, currency) {
  if (amount == null || isNaN(amount)) return 0;
  if (currency === "CLP" || !currency) return amount;
  if (currency === "USD") return amount * (state.settings.usd || 0);
  if (currency === "UF")  return amount * (state.settings.uf  || 0);
  return amount;
}

/* ============ CALCULATIONS ============ */

function calcCapital() {
  const assetsCLP = (state.assets || []).map(a => ({
    ...a,
    valueCLP: toCLP(a.value || 0, a.currency),
    _liquidity: assetLiquidityEff(a),
    _risk: assetRiskEff(a),
    _annualReturn: assetReturnEff(a),
  }));
  const grossAssets = assetsCLP.reduce((s, a) => s + a.valueCLP, 0);
  const liabCLP = (state.liabilities || []).map(l => ({ ...l, balanceCLP: toCLP(l.balance || 0, l.currency) }));
  const totalDebt = liabCLP.reduce((s, l) => s + l.balanceCLP, 0);
  const netWorth = grossAssets - totalDebt;

  // Liquidity: pondera valor por weight de liquidity (usa efectivo)
  const liquidityValue = assetsCLP.reduce((s, a) => {
    const w = LIQUIDITY[a._liquidity]?.weight ?? 1.0;
    return s + a.valueCLP * w;
  }, 0);
  // Liquidez "inmediata + 2d" (sin penalty)
  const fastLiquidValue = assetsCLP
    .filter(a => a._liquidity === "immediate" || a._liquidity === "two_days")
    .reduce((s, a) => s + a.valueCLP, 0);

  // Por clase
  const byClass = {};
  Object.keys(ASSET_CLASSES).forEach(k => byClass[k] = 0);
  assetsCLP.forEach(a => { byClass[a.class] = (byClass[a.class] || 0) + a.valueCLP; });
  // Por moneda
  const byCurrency = { CLP: 0, USD: 0, UF: 0 };
  assetsCLP.forEach(a => { byCurrency[a.currency || "CLP"] = (byCurrency[a.currency || "CLP"] || 0) + a.valueCLP; });
  // Exposiciones
  const realEstateExposure = byClass.real_estate || 0;
  const usdExposure = byCurrency.USD || 0;
  // Líquido vs ilíquido
  const liquidValue = assetsCLP
    .filter(a => a._liquidity === "immediate" || a._liquidity === "two_days" || a._liquidity === "thirty_days")
    .reduce((s, a) => s + a.valueCLP, 0);
  const illiquidValue = assetsCLP
    .filter(a => a._liquidity === "locked")
    .reduce((s, a) => s + a.valueCLP, 0);

  // Income from assets (passive)
  const passiveIncomeMonthly = assetsCLP.reduce((s, a) => s + toCLP(a.monthlyIncome || 0, a.currency || "CLP"), 0);

  return {
    assetsCLP, liabCLP,
    grossAssets, totalDebt, netWorth,
    liquidityValue, fastLiquidValue, liquidValue, illiquidValue,
    byClass, byCurrency,
    realEstateExposure, usdExposure,
    passiveIncomeMonthly,
  };
}

function calcCashflow() {
  const income = (state.cashflow?.income || []).reduce((s, i) => s + toCLP(i.amount || 0, i.currency), 0);
  const stableIncome = (state.cashflow?.income || []).filter(i => i.stable).reduce((s, i) => s + toCLP(i.amount || 0, i.currency), 0);
  const expenses = (state.cashflow?.expenses || []).reduce((s, e) => s + toCLP(e.amount || 0, e.currency), 0);
  // Debt servicing (cuotas mensuales de pasivos)
  const debtService = (state.liabilities || []).reduce((s, l) => s + toCLP(l.monthlyPayment || 0, l.currency || "CLP"), 0);
  const freeFlow = income - expenses - debtService;
  const stableFreeFlow = stableIncome - expenses - debtService;
  const savingsRate = income > 0 ? freeFlow / income : 0;

  // Burn rate (gastos + servicio deuda)
  const burn = expenses + debtService;

  // Runway: caja "líquida rápida" / burn
  const cap = calcCapital();
  const runway = burn > 0 ? cap.fastLiquidValue / burn : 99;

  // DTI: cuota deuda / ingreso bruto
  const dti = income > 0 ? debtService / income : 0;

  return { income, stableIncome, expenses, debtService, burn, freeFlow, stableFreeFlow, savingsRate, runway, dti };
}

function calcGoalProgress(goal) {
  const cap = calcCapital();
  let current = 0;
  if (goal.type === "net_worth") current = cap.netWorth;
  else if (goal.type === "invested_capital") {
    // suma assets que no son cash ni real_estate (lo invertido líquido)
    current = (state.assets || []).filter(a => !["cash", "real_estate"].includes(a.class)).reduce((s, a) => s + toCLP(a.value || 0, a.currency), 0);
  }
  else if (goal.type === "asset_down") {
    // cash + investments líquidos rápidos
    current = cap.fastLiquidValue;
  }
  else if (goal.type === "passive_income") {
    current = cap.passiveIncomeMonthly + (state.assets || []).reduce((s, a) => {
      if (["cash", "real_estate"].includes(a.class)) return s;
      const yld = (a.annualReturn || 0) * 0.5; // asumir 50% del retorno como yield, ajustable
      return s + (toCLP(a.value || 0, a.currency) * yld) / 12;
    }, 0);
  }
  else if (goal.type === "liquidity") current = cap.fastLiquidValue;
  const pct = goal.target > 0 ? current / goal.target : 0;
  return { current, target: goal.target, pct: Math.max(0, Math.min(2, pct)) };
}

function calcMonthsToGoal(goal, deltas) {
  // Solve FV: needed = current * (1+r/12)^n + alloc * ((1+r/12)^n - 1) / (r/12)
  // Given delta:
  //   alloc' = alloc + deltas.allocDelta
  //   current' = current + deltas.cashDelta
  // returns months (or null si infinito o ya alcanzado)
  const prog = calcGoalProgress(goal);
  const cur0 = prog.current + (deltas?.cashDelta || 0);
  const alloc = Math.max(0, (goal.monthlyAlloc || 0) + (deltas?.allocDelta || 0));
  if (cur0 >= goal.target) return 0;
  const r = (goal.annualReturn || 0) / 12;
  if (alloc <= 0 && r <= 0) return null;
  // Binary search / iterate (max 600 months = 50 years)
  let bal = cur0;
  for (let m = 1; m <= 600; m++) {
    bal = bal * (1 + r) + alloc;
    if (bal >= goal.target) return m;
  }
  return null;
}

/* Returns +n meses delay, -n meses adelantado, 0 sin cambio. null si no calculable. */
function goalImpactFromDeltas(goal, deltas) {
  const baseline = calcMonthsToGoal(goal, null);
  const scenario = calcMonthsToGoal(goal, deltas);
  if (baseline == null && scenario == null) return null;
  if (baseline == null) return -9999; // antes era inalcanzable, ahora alcanzable: gran mejora
  if (scenario == null) return 9999;  // ahora es inalcanzable
  return scenario - baseline;
}

/* helpers para inputs en form */
function fInput(name, label, value, opts) {
  opts = opts || {};
  const type = opts.type || "text";
  const hint = opts.hint ? `<span class="field-hint">${opts.hint}</span>` : "";
  const placeholder = opts.placeholder ? `placeholder="${esc(opts.placeholder)}"` : "";
  const step = opts.step ? `step="${opts.step}"` : "";
  const min = opts.min != null ? `min="${opts.min}"` : "";
  const max = opts.max != null ? `max="${opts.max}"` : "";
  const span = opts.span2 ? ' style="grid-column: span 2;"' : "";
  return `<label class="field"${span}>${esc(label)}${hint}<input type="${type}" name="${name}" value="${value == null ? "" : esc(String(value))}" ${placeholder} ${step} ${min} ${max}></label>`;
}
function fSelect(name, label, value, options, opts) {
  opts = opts || {};
  const hint = opts.hint ? `<span class="field-hint">${opts.hint}</span>` : "";
  const opts_html = options.map(o => {
    const v = o.value != null ? o.value : o;
    const l = o.label != null ? o.label : o;
    const sel = String(v) === String(value) ? "selected" : "";
    return `<option value="${esc(v)}" ${sel}>${esc(l)}</option>`;
  }).join("");
  const span = opts.span2 ? ' style="grid-column: span 2;"' : "";
  return `<label class="field"${span}>${esc(label)}${hint}<select name="${name}">${opts_html}</select></label>`;
}
function fTextarea(name, label, value, opts) {
  opts = opts || {};
  const hint = opts.hint ? `<span class="field-hint">${opts.hint}</span>` : "";
  const placeholder = opts.placeholder ? `placeholder="${esc(opts.placeholder)}"` : "";
  return `<label class="field" style="grid-column: span 2;">${esc(label)}${hint}<textarea name="${name}" ${placeholder}>${value == null ? "" : esc(String(value))}</textarea></label>`;
}
function fCheckbox(name, label, value) {
  return `<label class="field" style="grid-column: span 2;flex-direction: row;align-items:center;gap:10px;display:flex;"><input type="checkbox" name="${name}" ${value ? "checked" : ""}><span>${esc(label)}</span></label>`;
}
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }


function fAdvancedOpen() {

/* Path helpers para top-level array entities */
function getEntityArray(entityType) {
  const def = ENTITY[entityType];
  if (!def) return null;
  if (def.parentEntity) return null; // nested
  const path = def.arrayPath.split(".");
  let cursor = state;
  for (const k of path) cursor = cursor[k];
  return cursor;
}

function getNestedArray(entityType, parentId) {
  const def = ENTITY[entityType];
  if (!def || !def.parentEntity) return null;
  // Special case: tcMovement lives in state.tcMovements, not inside the liability
  if (entityType === "tcMovement") {
    if (!Array.isArray(state.tcMovements)) state.tcMovements = [];
    return state.tcMovements;
  }
  const parentArr = getEntityArray(def.parentEntity);
  const parent = parentArr.find(p => p.id === parentId);
  if (!parent) return null;
  if (!parent[def.parentField]) parent[def.parentField] = [];
  return parent[def.parentField];
}

function openEntityForm(entityType, id, parentId) {
  const def = ENTITY[entityType];
  if (!def) return;
  let item, isNew = false;
  if (id) {
    const arr = def.parentEntity ? getNestedArray(entityType, parentId) : getEntityArray(entityType);
    if (!arr) { toast(`No se encontró ${def.label}`, "bad"); return; }
    item = arr.find(e => e.id === id);
    if (!item) { toast(`${def.label} no existe`, "bad"); return; }
  } else {
    item = def.defaults();
    isNew = true;
  }
  crudCtx = { entityType, parentId, id: item.id, isNew };
  const formHtml = def.form(item);
  const title = (isNew ? "Nueva " : "Editar ") + def.label.toLowerCase();
  const sub = isNew ? "Completá los campos y guardá" : "Modificá los campos que necesites";
  document.getElementById("drawerTitle").textContent = title;
  document.getElementById("drawerSub").textContent = sub;
  document.getElementById("drawerBody").innerHTML = `<form class="form-grid" id="entityForm" onsubmit="return false;">${formHtml}</form>`;
  document.getElementById("drawerFoot").style.display = "flex";
  document.getElementById("drawerFootLeft").innerHTML = isNew ? "" : `<button class="btn danger sm" type="button" data-action="entity-delete">Eliminar</button>`;
  openDrawer();
}

function readEntityForm() {
  const form = document.getElementById("entityForm");
  if (!form) return null;
  const data = {};
  Array.from(form.elements).forEach(el => {
    if (!el.name) return;
    if (el.type === "checkbox") data[el.name] = el.checked;
    else data[el.name] = el.value;
  });
  return data;
}

function saveEntityForm() {
  if (!crudCtx) return;
  const def = ENTITY[crudCtx.entityType];
  const raw = readEntityForm();
  if (!raw) return;
  const parsed = def.parse(raw);
  const err = def.validate(parsed);
  if (err) { toast(err, "bad"); return; }
  const arr = def.parentEntity ? getNestedArray(crudCtx.entityType, crudCtx.parentId) : getEntityArray(crudCtx.entityType);
  if (!arr) { toast("Contenedor no encontrado", "bad"); return; }
  // tcMovement needs liability_id
  if (crudCtx.entityType === "tcMovement") {
    parsed.liability_id = crudCtx.parentId;
  }
  if (crudCtx.isNew) {
    arr.push({ id: crudCtx.id, ...parsed });
  } else {
    const idx = arr.findIndex(e => e.id === crudCtx.id);
    if (idx < 0) { toast("Item no encontrado", "bad"); return; }
    const existing = arr[idx];
    const preserveKeys = def.preserveNested || [];
    const preserved = {};
    preserveKeys.forEach(k => { if (existing[k] != null) preserved[k] = existing[k]; });
    arr[idx] = { ...existing, ...parsed, ...preserved, id: existing.id };
  }
  saveState();
  closeDrawer();
  toast(`${def.label} guardad${def.label.endsWith("a") ? "a" : "o"}`, "good");
  renderApp();
}

function deleteEntity(entityType, id, parentId) {
  const def = ENTITY[entityType];
  if (!def) return;
  const arr = def.parentEntity ? getNestedArray(entityType, parentId) : getEntityArray(entityType);
  if (!arr) return;
  const idx = arr.findIndex(e => e.id === id);
  if (idx < 0) return;
  arr.splice(idx, 1);
  saveState();
  toast(`${def.label} eliminad${def.label.endsWith("a") ? "a" : "o"}`, "good");
  renderApp();
}

function deleteEntityFromDrawer() {
  if (!crudCtx) return;
  const def = ENTITY[crudCtx.entityType];
  confirmAction(`Eliminar ${def.label.toLowerCase()}`, `¿Confirmar eliminación? No se puede deshacer.`, () => {
    deleteEntity(crudCtx.entityType, crudCtx.id, crudCtx.parentId);
    closeDrawer();
  });
}

function renderApp() {
  // Re-render sidebar nav, side card, and current view
  renderNav();
  renderSideCard();

  const mod = MODULES.find(m => m.id === view) || MODULES[0];
  document.getElementById("kicker").textContent = mod.kicker;
  document.getElementById("title").textContent = mod.label;

  app.innerHTML = "";
  if (view === "today") renderToday(app);
  else if (view === "capital") renderCapital(app);
  else if (view === "cashflow") renderCashflow(app);
  else if (view === "decisions") renderDecisions(app);
  else if (view === "venture") renderVenture(app);

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = MODULES.map((m, i) => `
    <button type="button" data-view="${m.id}" class="${state.ui.view === m.id ? "active" : ""}">

}

function renderSideCard() {
  const cap = calcCapital();

/* ---------- TODAY ---------- */

        </div>

        <div class="progress"><div class="row"><span class="muted">Reserva objetivo</span><strong class="num">${fmtShort(cap.fastLiquidValue)} / ${fmtShort(reservaTarget)}</strong></div><div class="bar ${reservaPct >= 1 ? "green" : reservaPct >= 0.5 ? "amber" : "red"}"><span style="--w:${(reservaPct * 100).toFixed(1)}%"></span></div></div>

function renderTCWidget() {
  const tcs = getTCs().filter(l => l.creditLimit && l.cutoffDay);
  if (!tcs.length) return "";
  const cards = tcs.map(tc => {
    const cd = tcCycleData(tc);
    const pct = cd.utilization != null ? cd.utilization * 100 : 0;
    const barClass = pct >= 80 ? "bad" : pct >= 50 ? "warn" : pct >= 30 ? "warn" : "good";
    if (pct < 30) return ""; // si está bajo 30%, no llenamos el dashboard con esto
    return `
      <div class="tc-card">
        <div class="tc-head">
          <div>
            <div class="tc-name">${esc(tc.name)}</div>
            <div class="tc-meta">Ciclo cierra en ${cd.daysToCutoff} día${cd.daysToCutoff === 1 ? "" : "s"} (día ${tc.cutoffDay})</div>
          </div>
          <span class="badge ${barClass}">${pct.toFixed(0)}% del cupo</span>
        </div>
        <div class="tc-bar ${barClass}"><span style="--w:${pct}%"></span></div>
        <div class="tc-detail">
          <div class="tc-row"><span class="muted">Consumido este ciclo</span><strong class="num">${fmtShort(cd.cycleTotal)}</strong></div>
          <div class="tc-row"><span class="muted">Cupo</span><strong class="num">${fmtShort(tc.creditLimit)}</strong></div>
        </div>
      </div>
    `;
  }).filter(Boolean).join("");
  if (!cards) return "";
  return `<div class="panel"><div class="panel-header"><div><h3>Tarjetas — ojo con esto</h3><p class="panel-sub">TCs con utilización sobre 30% del cupo en el ciclo en curso.</p></div><button class="btn sm" type="button" data-action="goto-cashflow">Ver detalle</button></div><div class="grid cols-2">${cards}</div></div>`;
}

        <div class="row"><span class="muted">Capacidad de inversión</span><strong class="num accent">${fmtShort(Math.max(0, cf.freeFlow))}</strong></div>
        <div class="row"><span class="muted">Burn rate (gastos + deuda)</span><strong class="num">${fmtShort(cf.burn)}</strong></div>
        <div class="row"><span class="muted">Runway con liquidez rápida</span><strong class="num">${cf.runway > 99 ? "99+" : cf.runway.toFixed(1)}m</strong></div>
        <div class="row"><span class="muted">Reserva (${state.settings.reserveMonths}m de burn)</span><strong class="num">${fmtShort(cf.burn * state.settings.reserveMonths)}</strong></div>

}

function renderTCSection() {
  const tcs = getTCs();
  if (!tcs.length) return `<div class="panel"><div class="panel-header"><div><h3>Tarjetas de crédito</h3><p class="panel-sub">No tenés TCs cargadas como liability. Agregá una en Capital → Deudas con tipo "Tarjeta crédito" para tener seguimiento de ciclo.</p></div></div></div>`;
  const cards = tcs.map(tc => {
    const cd = tcCycleData(tc);
    if (!tc.creditLimit || !tc.cutoffDay) {
      return `<div class="tc-card">
        <div class="tc-head">
          <div>
            <div class="tc-name">${esc(tc.name)}</div>
            <div class="tc-meta">Cupo y día de corte no configurados — <button class="btn sm ghost" type="button" data-action="edit-liability" data-id="${tc.id}">Configurar</button></div>
          </div>
        </div>
      </div>`;
    }
    const pct = cd.utilization != null ? cd.utilization * 100 : 0;
    const barClass = pct >= 80 ? "bad" : pct >= 50 ? "warn" : pct >= 30 ? "warn" : "good";
    const movs = cd.cycleCharges;
    const movsHtml = movs.length ? movs.map(m => `
      <div class="tc-mov-row" data-action="edit-tcMovement" data-id="${m.id}" data-parent="${tc.id}">
        <span class="tc-mov-date">${esc(m.date)}</span>
        <span class="tc-mov-concept">${esc(m.concept)}</span>
        <span class="tc-mov-amount">${fmtShort(m.amount)}</span>
      </div>
    `).join("") : `<div class="tc-mov-empty">Sin movimientos en este ciclo todavía.</div>`;
    return `
      <div class="tc-card">
        <div class="tc-head">
          <div>
            <div class="tc-name">${esc(tc.name)}</div>
            <div class="tc-meta">Cupo ${fmtShort(tc.creditLimit)} · Cierra día ${tc.cutoffDay} (en ${cd.daysToCutoff} día${cd.daysToCutoff === 1 ? "" : "s"})</div>
          </div>
          <button class="btn primary sm" type="button" data-action="new-tcMovement" data-parent="${tc.id}">+ Cargo</button>
        </div>
        <div class="tc-bar ${barClass}"><span style="--w:${pct}%"></span></div>
        <div class="tc-detail">
          <div class="tc-row"><span class="muted">Consumido este ciclo</span><strong class="num">${fmtShort(cd.cycleTotal)}</strong></div>
          <div class="tc-row"><span class="muted">Utilización del cupo</span><strong class="num ${barClass}">${pct.toFixed(0)}%</strong></div>
          <div class="tc-row"><span class="muted">Disponible</span><strong class="num">${fmtShort(Math.max(0, (tc.creditLimit || 0) - cd.cycleTotal))}</strong></div>
        </div>
        <div class="tc-cycle-list">
          <h4 style="font-size:11px;color:var(--muted);font-weight:600;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:4px;">Movimientos del ciclo (${movs.length})</h4>
          ${movsHtml}
        </div>
      </div>
    `;
  }).join("");
  return `<div class="panel"><div class="panel-header"><div><h3>Tarjetas de crédito — ciclo en curso</h3><p class="panel-sub">Registrá cargos para saber cuándo medirte. Cerrá el ciclo el día del corte; lo consumido se vuelve el monto a pagar.</p></div></div><div class="grid cols-2">${cards}</div></div>`;
}

/* ---------- DECISIONES (v0.5 — 8 templates, persistente, con goal impact) ---------- */

  const cf = calcCashflow();
  const savedDecisions = state.decisions || [];

  root.innerHTML = `
    <div class="panel tight">

      <div class="grid cols-4">
        <div class="metric"><label>Cash rápido</label><strong class="num">${fmtShort(cap.fastLiquidValue)}</strong><small>Líquido en ≤ 2 días</small></div>
        <div class="metric accent"><label>Flujo libre</label><strong class="num">${fmtShort(cf.freeFlow)}</strong><small>${fmtPct(cf.savingsRate)} savings rate</small></div>

        <div class="metric ${cf.runway < 3 ? "bad" : cf.runway < 6 ? "warn" : "good"}"><label>Runway</label><strong class="num">${cf.runway > 99 ? "99+" : cf.runway.toFixed(1)}m</strong><small>Reserva: ${fmtShort(reserveTarget)} (${(reservePct*100).toFixed(0)}%)</small></div>

      <div class="grid cols-3" id="decision-templates">
        ${Object.values(DECISION_TEMPLATES).map(t => `
          <button class="panel tight decision-template-card" type="button" data-action="open-decision" data-template="${t.key}" style="cursor:pointer;text-align:left;border:0.5px solid var(--line);">

      ${savedDecisions.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Nombre</th><th>Plantilla</th><th class="r">Cash inicial</th><th class="r">Δ flujo / mes</th><th>Veredicto</th></tr></thead>
        <tbody>${savedDecisions.map(dec => {
          const tpl = DECISION_TEMPLATES[dec.template];
          if (!tpl) return "";
          const deltas = tpl.compute(dec.inputs, state);
          const verdict = makeVerdict(deltas, state);
          const verdictBadge = verdict.level === "viable" ? '<span class="badge good">Viable</span>' : verdict.level === "wait" ? '<span class="badge warn">Esperar</span>' : '<span class="badge bad">No ahora</span>';
          return `<tr class="row-hover" data-action="open-decision" data-template="${dec.template}" data-id="${dec.id}">
            <td><strong>${esc(dec.name)}</strong>${dec.notes ? `<div class="muted" style="font-size:11px;">${esc(dec.notes.slice(0, 60))}${dec.notes.length > 60 ? "…" : ""}</div>` : ""}</td>
            <td>${tpl.icon} ${esc(tpl.label)}</td>
            <td class="r num">${fmtShort(deltas.cashDelta)}</td>
            <td class="r num ${(deltas.monthlyFlowDelta || 0) < 0 ? "bad" : "good"}">${(deltas.monthlyFlowDelta || 0) >= 0 ? "+" : ""}${fmtShort(deltas.monthlyFlowDelta || 0)}</td>
            <td>${verdictBadge}</td>

let decisionDraft = null; // { template, id, inputs, name, notes, isNew }

function openDecision(templateKey, decisionId) {
  const tpl = DECISION_TEMPLATES[templateKey];
  if (!tpl) { toast("Plantilla desconocida: " + templateKey, "bad"); return; }
  let saved = null, isNew = true;
  if (decisionId) {
    saved = (state.decisions || []).find(d => d.id === decisionId);
    if (saved) isNew = false;
  }
  const inputs = {};
  tpl.fields.forEach(f => {
    inputs[f.id] = saved ? (saved.inputs[f.id] != null ? saved.inputs[f.id] : f.def) : f.def;
  });
  decisionDraft = {
    template: templateKey,
    id: saved ? saved.id : null,
    inputs,
    name: saved ? saved.name : tpl.label,
    notes: saved ? saved.notes : "",
    isNew,
  };
  document.getElementById("drawerTitle").textContent = (isNew ? "Nueva — " : "Editar — ") + tpl.label;
  document.getElementById("drawerSub").textContent = tpl.description;
  document.getElementById("drawerBody").innerHTML = renderDecisionForm();
  document.getElementById("drawerFoot").style.display = "flex";
  document.getElementById("drawerFootLeft").innerHTML = isNew ? "" : `<button class="btn danger sm" type="button" data-action="decision-delete">Eliminar</button>`;
  // Wire up live updates
  setTimeout(() => {
    document.querySelectorAll("[data-decision-input]").forEach(el => {
      const evt = el.type === "checkbox" ? "change" : "input";
      el.addEventListener(evt, () => {
        const id = el.dataset.decisionInput;
        const f = tpl.fields.find(ff => ff.id === id);
        if (f && f.type === "select") decisionDraft.inputs[id] = el.value;
        else if (f && f.type === "toggle") decisionDraft.inputs[id] = el.checked;
        else decisionDraft.inputs[id] = Number(el.value);
        rerenderDecisionAnalysis();
        // Si cambió pieEnCuotas, hay que regenerar el form porque cuotasMeses depende
        if (id === "pieEnCuotas") {
          document.getElementById("drawerBody").innerHTML = renderDecisionForm();
          // re-wire listeners
          setTimeout(() => openDecisionReWire(), 10);
        }
      });
    });
    const nameEl = document.getElementById("decision-name");
    if (nameEl) nameEl.addEventListener("input", () => { decisionDraft.name = nameEl.value; });
    const notesEl = document.getElementById("decision-notes");
    if (notesEl) notesEl.addEventListener("input", () => { decisionDraft.notes = notesEl.value; });
  }, 20);
  openDrawer();
}

function openDecisionReWire() {
  const tpl = DECISION_TEMPLATES[decisionDraft.template];
  document.querySelectorAll("[data-decision-input]").forEach(el => {
    const evt = el.type === "checkbox" ? "change" : "input";
    el.addEventListener(evt, () => {
      const id = el.dataset.decisionInput;
      const f = tpl.fields.find(ff => ff.id === id);
      if (f && f.type === "select") decisionDraft.inputs[id] = el.value;
      else if (f && f.type === "toggle") decisionDraft.inputs[id] = el.checked;
      else decisionDraft.inputs[id] = Number(el.value);
      rerenderDecisionAnalysis();
      if (id === "pieEnCuotas") {
        document.getElementById("drawerBody").innerHTML = renderDecisionForm();
        setTimeout(() => openDecisionReWire(), 10);
      }
    });
  });
  const nameEl = document.getElementById("decision-name");
  if (nameEl) nameEl.addEventListener("input", () => { decisionDraft.name = nameEl.value; });
  const notesEl = document.getElementById("decision-notes");
  if (notesEl) notesEl.addEventListener("input", () => { decisionDraft.notes = notesEl.value; });
}

function renderDecisionFieldHtml(f) {
  const val = decisionDraft.inputs[f.id];
  const hint = f.hint ? `<span class="field-hint">${esc(f.hint)}</span>` : "";
  if (f.type === "select") {
    const opts = (f.opts || []).map(o => `<option value="${esc(o.value)}" ${String(val) === String(o.value) ? "selected" : ""}>${esc(o.label)}</option>`).join("");
    return `<label class="field">${esc(f.label)}${hint}<select data-decision-input="${esc(f.id)}">${opts}</select></label>`;
  }
  if (f.type === "toggle") {
    return `<label class="field" style="grid-column: span 2;flex-direction: row;align-items:center;gap:10px;display:flex;">
      <input type="checkbox" data-decision-input="${esc(f.id)}" ${val ? "checked" : ""}>
      <span>${esc(f.label)}${hint}</span>
    </label>`;
  }
  const step = f.step ? `step="${f.step}"` : "";
  return `<label class="field">${esc(f.label)}${hint}<input type="number" data-decision-input="${esc(f.id)}" value="${val == null ? 0 : val}" ${step}></label>`;
}

function renderDecisionForm() {
  const tpl = DECISION_TEMPLATES[decisionDraft.template];
  const essentialIds = DECISION_ESSENTIAL_FIELDS[decisionDraft.template] || tpl.fields.map(f => f.id);
  const essentialFields = tpl.fields.filter(f => essentialIds.includes(f.id));
  const advancedFields = tpl.fields.filter(f => !essentialIds.includes(f.id));
  const essentialHtml = essentialFields.map(renderDecisionFieldHtml).join("");
  const advancedHtml = advancedFields.map(renderDecisionFieldHtml).join("");
  const advancedBlock = advancedFields.length ? `
    <div class="advanced-toggle"><button type="button" data-action="toggle-advanced">Mostrar supuestos del modelo ↓</button></div>
    <div class="advanced-section">${advancedHtml}</div>
  ` : "";
  return `
    <div class="field" style="grid-column: span 2;">
      <label style="display:block;">Nombre <span class="field-hint">Para distinguir si guardás múltiples versiones</span></label>
      <input type="text" id="decision-name" value="${esc(decisionDraft.name)}" placeholder="Ej: Mazda 3 financiado a 48m">
    </div>
    <div class="form-grid">${essentialHtml}${advancedBlock}</div>
    <div class="field" style="grid-column: span 2;">
      <label>Notas (opcional)<span class="field-hint">Contexto, condiciones, lo que estás esperando</span></label>
      <textarea id="decision-notes" placeholder="Ej: Esperar bono Q2 antes de decidir...">${esc(decisionDraft.notes)}</textarea>
    </div>
    <div id="decision-analysis">${renderDecisionAnalysis()}</div>
  `;
}

function rerenderDecisionAnalysis() {
  const el = document.getElementById("decision-analysis");
  if (el) el.innerHTML = renderDecisionAnalysis();
}

function renderDecisionAnalysis() {
  const tpl = DECISION_TEMPLATES[decisionDraft.template];
  const deltas = tpl.compute(decisionDraft.inputs, state);
  const cap = calcCapital();
  const cf = calcCashflow();
  // Si hay phases (pie en cuotas), renderizar ambas fases por separado y el resto basado en fase 1
  let phasesHtml = "";
  if (deltas.phases && deltas.phases.length === 2) {
    phasesHtml = `
      <div class="grid cols-2" style="margin-top:8px;">
        ${deltas.phases.map((ph, idx) => {
          const cashP = cap.fastLiquidValue + (ph.cashDelta || 0);
          const flowP = cf.freeFlow + (ph.monthlyFlowDelta || 0);
          const burnP = cf.burn + (ph.monthlyDebtAdded || 0);
          const runwayP = burnP > 0 ? cashP / burnP : 99;
          const debtP = cap.totalDebt + (ph.debtAdded || 0);
          const dtiP = cf.income > 0 ? (cf.debtService + (ph.monthlyDebtAdded || 0)) / cf.income : 0;
          const v = makeVerdict({ ...ph, cashDelta: ph.cashDelta, monthlyFlowDelta: ph.monthlyFlowDelta, monthlyDebtAdded: ph.monthlyDebtAdded, debtAdded: ph.debtAdded, assetAdded: ph.assetAdded }, state);
          const vc = v.level === "viable" ? "good" : v.level === "wait" ? "warn" : "bad";
          return `<div class="phase-card phase-${idx+1}">
            <h4>${esc(ph.name)}</h4>
            <div class="phase-meta">${ph.durationMonths ? "Dura " + ph.durationMonths + " meses" : "Desde escrituración en adelante"} · <span class="badge ${vc}">${esc(v.label)}</span></div>
            <div class="row"><span class="muted">Cash inicial</span><strong class="num ${(ph.cashDelta || 0) < 0 ? "bad" : ""}">${fmtShort(ph.cashDelta || 0)}</strong></div>
            <div class="row"><span class="muted">Δ flujo / mes</span><strong class="num ${(ph.monthlyFlowDelta || 0) < 0 ? "bad" : "good"}">${(ph.monthlyFlowDelta || 0) >= 0 ? "+" : ""}${fmtShort(ph.monthlyFlowDelta || 0)}</strong></div>
            <div class="row"><span class="muted">Flujo libre post</span><strong class="num ${flowP < 0 ? "bad" : ""}">${fmtShort(flowP)}</strong></div>
            <div class="row"><span class="muted">Runway post</span><strong class="num ${runwayP < 3 ? "bad" : ""}">${runwayP > 99 ? "99+" : runwayP.toFixed(1)}m</strong></div>
            <div class="row"><span class="muted">Deuda agregada</span><strong class="num">${fmtShort(ph.debtAdded || 0)}</strong></div>
            <div class="row"><span class="muted">DTI</span><strong class="num ${dtiP > 0.35 ? "bad" : ""}">${fmtPct(dtiP)}</strong></div>
          </div>`;
        }).join("")}
      </div>
      <p class="muted" style="font-size:11px;margin-top:8px;">Las fases se evalúan por separado. El veredicto principal abajo refleja la fase más exigente. La proyección no compone automáticamente (Modo A simplificado).</p>
    `;
  }
  const cashPost = cap.fastLiquidValue + (deltas.cashDelta || 0);
  const flowPost = cf.freeFlow + (deltas.monthlyFlowDelta || 0);
  const debtPost = cap.totalDebt + (deltas.debtAdded || 0);
  const debtServicePost = cf.debtService + (deltas.monthlyDebtAdded || 0);
  const dtiPost = cf.income > 0 ? debtServicePost / cf.income : 0;
  const burnPost = cf.burn + (deltas.monthlyDebtAdded || 0);
  const runwayPost = burnPost > 0 ? cashPost / burnPost : 99;
  const nw12 = projectNetWorth(12, deltas);
  const nw24 = projectNetWorth(24, deltas);
  const nw36 = projectNetWorth(36, deltas);
  const nwBase12 = projectNetWorth(12, null);
  const nwBase24 = projectNetWorth(24, null);
  const nwBase36 = projectNetWorth(36, null);
  const verdict = makeVerdict(deltas, state);

  // Goal impact
  const goalImpacts = (state.goals || []).map(g => {
    const baselineMonths = calcMonthsToGoal(g, null);
    const scenarioMonths = calcMonthsToGoal(g, {
      cashDelta: deltas.cashDelta || 0,
      allocDelta: Math.min(0, deltas.monthlyFlowDelta || 0), // si afecta flujo, asume reduce alloc disponible
    });
    let diffText = "—", cls = "muted";
    if (baselineMonths == null && scenarioMonths == null) diffText = "no alcanzable";
    else if (baselineMonths == null) diffText = "ahora alcanzable en " + fmtMonths(scenarioMonths) + "  ⚡";
    else if (scenarioMonths == null) { diffText = "se vuelve inalcanzable"; cls = "bad"; }
    else {
      const d = scenarioMonths - baselineMonths;
      if (d === 0) diffText = "sin cambio";
      else if (d > 0) { diffText = "retrasa " + fmtMonths(d); cls = "bad"; }
      else { diffText = "adelanta " + fmtMonths(-d); cls = "good"; }
    }
    return { goal: g, diffText, cls, baselineMonths, scenarioMonths };
  });

  const explanationsHtml = Object.entries(deltas.explanations || {}).map(([k, v]) => {
    const formatted = typeof v === "number" ? (Math.abs(v) < 1 ? (v * 100).toFixed(2) + "%" : fmtShort(v)) : v;
    return `<div class="row" style="font-size:12px;"><span class="muted">${esc(k)}</span><strong class="num">${esc(String(formatted))}</strong></div>`;
  }).join("");

  const verdictClass = verdict.level === "viable" ? "good" : verdict.level === "wait" ? "warn" : "bad";
  const verdictBg = verdict.level === "viable" ? "rgba(85,213,138,0.06)" : verdict.level === "wait" ? "rgba(231,189,88,0.06)" : "rgba(255,107,107,0.06)";

function saveDecision() {
  if (!decisionDraft) return;
  if (!decisionDraft.name || !decisionDraft.name.trim()) { toast("Ponele un nombre a la decisión", "bad"); return; }
  if (!Array.isArray(state.decisions)) state.decisions = [];
  if (decisionDraft.isNew) {
    state.decisions.push({
      id: uid("dec"),
      template: decisionDraft.template,
      name: decisionDraft.name.trim(),
      inputs: { ...decisionDraft.inputs },
      notes: decisionDraft.notes || "",
      createdAt: todayISO(),
    });
  } else {
    const idx = state.decisions.findIndex(d => d.id === decisionDraft.id);
    if (idx >= 0) {
      state.decisions[idx] = {
        ...state.decisions[idx],
        name: decisionDraft.name.trim(),
        inputs: { ...decisionDraft.inputs },
        notes: decisionDraft.notes || "",
      };
    }
  }
  saveState();
  decisionDraft = null;
  closeDrawer();
  toast("Decisión guardada", "good");
  renderApp();
}

function deleteDecision() {
  if (!decisionDraft || decisionDraft.isNew) return;
  confirmAction("Eliminar decisión", "¿Confirmar eliminación? No se puede deshacer.", () => {
    state.decisions = (state.decisions || []).filter(d => d.id !== decisionDraft.id);
    saveState();
    decisionDraft = null;
    closeConfirm();
    closeDrawer();
    toast("Decisión eliminada", "good");
    renderApp();
  });
}

/* ---------- VENTURE LAB (Slice 1: básico, profundización en Slice 2) ---------- */
function renderVenture(root) {
  const businesses = state.businesses || [];
  if (!state.ui.businessId || !businesses.find(b => b.id === state.ui.businessId)) {
    state.ui.businessId = businesses[0]?.id || null;
  }
  const selected = businesses.find(b => b.id === state.ui.businessId);

  const businessTabs = businesses.length ? `
    <div class="chips">
      ${businesses.map(b => `<button class="chip ${b.id === state.ui.businessId ? "active" : ""}" type="button" data-action="select-business" data-id="${b.id}">${esc(b.name)}</button>`).join("")}
      <button class="chip" type="button" data-action="new-business">+ Negocio</button>
    </div>
  ` : `<button class="btn primary sm" type="button" data-action="new-business">+ Crear primer negocio</button>`;

  if (!selected) {
    root.innerHTML = `
      <div class="panel">
        <div class="panel-header"><div><h3>Venture Lab</h3><p class="panel-sub">Side-business tracking. Cada negocio con productos, costos fijos y socios.</p></div></div>
        ${businessTabs}
        <div class="empty"><div class="empty-title">Sin negocios cargados</div>Creá tu primero con + Negocio.</div>
      </div>
    `;
    return;
  }

  const products = selected.products || [];
  const fixedCosts = selected.fixedCosts || [];
  const partners = selected.partners || [];

  // Unit economics
  const productMetrics = products.map(p => {
    const revenue = (p.price || 0) * (p.units || 0);
    const variableCost = (p.unitCost || 0) * (p.units || 0);
    const fees = revenue * (p.feePct || 0);
    const grossMargin = revenue - variableCost - fees;
    const grossMarginPct = revenue > 0 ? grossMargin / revenue : 0;
    return { ...p, revenue, variableCost, fees, grossMargin, grossMarginPct };
  });
  const totalRevenue = productMetrics.reduce((s, p) => s + p.revenue, 0);
  const totalVariableCost = productMetrics.reduce((s, p) => s + p.variableCost, 0);
  const totalFees = productMetrics.reduce((s, p) => s + p.fees, 0);
  const totalContribution = productMetrics.reduce((s, p) => s + p.grossMargin, 0);
  const totalFixed = fixedCosts.reduce((s, c) => s + (c.amount || 0), 0);
  const netMargin = totalContribution - totalFixed;
  const netMarginPct = totalRevenue > 0 ? netMargin / totalRevenue : 0;
  const grossMarginPct = totalRevenue > 0 ? totalContribution / totalRevenue : 0;
  // Break-even en CLP de revenue
  const cmRatio = totalRevenue > 0 ? totalContribution / totalRevenue : 0;
  const breakEvenCLP = cmRatio > 0 ? totalFixed / cmRatio : null;
  // Break-even en unidades agregadas (asume mix actual)
  const breakEvenUnits = (cmRatio > 0 && totalRevenue > 0) ? Math.ceil((products.reduce((s,p)=>s+(p.units||0),0)) * (breakEvenCLP / totalRevenue)) : null;
  // Payback (meses)
  const payback = netMargin > 0 ? (selected.initialInvestment || 0) / netMargin : null;
  // Runway con caja actual si netMargin negativo
  const runway = netMargin < 0 ? selected.cash / Math.abs(netMargin) : null;
  // Valor estimado
  const valuation = (netMargin > 0 ? netMargin * 12 * (selected.valuationMultiple || 2.0) : 0);
  // Aporte al flujo libre personal
  const ownerContribution = (netMargin > 0) ? netMargin * (selected.ownerShare || 0) : 0;

  root.innerHTML = `
    <div class="panel tight">
      <div class="panel-header"><div><h3>Venture Lab</h3><p class="panel-sub">Side-business tracking. Slice 2 sumará escenarios y profundidad.</p></div></div>
      ${businessTabs}
    </div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h3>${esc(selected.name)} <span class="badge">${esc(selected.stage)}</span></h3>
          <p class="panel-sub">${esc(PARTNER_STRUCTURES[selected.partnerStructure]?.label || selected.partnerStructure)} · Tu participación ${fmtPct(selected.ownerShare)}</p>
        </div>
        <button class="btn sm" type="button" data-action="edit-business" data-id="${selected.id}">Editar negocio</button>
      </div>
      <div class="grid cols-4">
        <div class="metric"><label>Revenue mensual</label><strong class="num">${fmtShort(totalRevenue)}</strong><small>Bruto de ventas</small></div>
        <div class="metric accent"><label>Contribución</label><strong class="num">${fmtShort(totalContribution)}</strong><small>${fmtPct(grossMarginPct)} margen bruto</small></div>
        <div class="metric ${netMargin > 0 ? "good" : "bad"}"><label>Margen neto</label><strong class="num">${fmtShort(netMargin)}</strong><small>${fmtPct(netMarginPct)}</small></div>
        <div class="metric"><label>Costos fijos</label><strong class="num">${fmtShort(totalFixed)}</strong><small>${fixedCosts.length} líneas</small></div>
      </div>
      <div class="grid cols-4">
        <div class="row"><span class="muted">Break-even revenue</span><strong class="num">${breakEvenCLP == null ? "—" : fmtShort(breakEvenCLP)}</strong></div>
        <div class="row"><span class="muted">Break-even unidades</span><strong class="num">${breakEvenUnits == null ? "—" : breakEvenUnits}</strong></div>
        <div class="row"><span class="muted">Payback (meses)</span><strong class="num">${payback == null ? "—" : fmtMonths(payback)}</strong></div>
        <div class="row"><span class="muted">Runway (con caja)</span><strong class="num">${runway == null ? "—" : fmtMonths(runway)}</strong></div>
        <div class="row"><span class="muted">Caja actual</span><strong class="num">${fmtShort(selected.cash || 0)}</strong></div>
        <div class="row"><span class="muted">Inversión inicial</span><strong class="num">${fmtShort(selected.initialInvestment || 0)}</strong></div>
        <div class="row"><span class="muted">Valor estimado (mult ${selected.valuationMultiple || 2}x utilidad anual)</span><strong class="num">${fmtShort(valuation)}</strong></div>
        <div class="row"><span class="muted">Aporte tuyo al flujo libre</span><strong class="num">${fmtShort(ownerContribution)}/mes</strong></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><div><h3>Productos / servicios</h3><p class="panel-sub">Click para editar.</p></div><button class="btn primary sm" type="button" data-action="new-product" data-id="${selected.id}">+ Producto</button></div>
      ${products.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Nombre</th><th class="r">Precio</th><th class="r">Costo unit.</th><th class="r">Unidades</th><th class="r">Fee</th><th class="r">Revenue</th><th class="r">Contribución</th><th class="r">% margen</th></tr></thead>
        <tbody>
          ${productMetrics.map(p => `<tr class="row-hover" data-action="edit-product" data-id="${p.id}" data-parent="${selected.id}">
            <td><strong>${esc(p.name)}</strong></td>
            <td class="r num">${fmtShort(p.price)}</td>
            <td class="r num">${fmtShort(p.unitCost)}</td>
            <td class="r num">${p.units}</td>
            <td class="r num">${fmtPct(p.feePct || 0)}</td>
            <td class="r num">${fmtShort(p.revenue)}</td>
            <td class="r num">${fmtShort(p.grossMargin)}</td>
            <td class="r num">${fmtPct(p.grossMarginPct)}</td>
          </tr>`).join("")}
        </tbody>
      </table></div>` : `<div class="empty"><div class="empty-title">Sin productos</div>Agregá productos para calcular contribución y break-even.</div>`}
    </div>

    <div class="split">
      <div class="panel">
        <div class="panel-header"><div><h3>Costos fijos</h3></div><button class="btn primary sm" type="button" data-action="new-fixedCost" data-id="${selected.id}">+ Costo</button></div>
        ${fixedCosts.length ? `<div class="table-wrap"><table class="compact-table">
          <thead><tr><th>Concepto</th><th class="r">CLP / mes</th></tr></thead>
          <tbody>${fixedCosts.map(c => `<tr class="row-hover" data-action="edit-fixedCost" data-id="${c.id}" data-parent="${selected.id}"><td>${esc(c.name)}</td><td class="r num">${fmtShort(c.amount)}</td></tr>`).join("")}</tbody>
        </table></div>` : `<div class="empty">Sin costos fijos.</div>`}
      </div>

      <div class="panel">
        <div class="panel-header"><div><h3>Socios</h3></div><button class="btn primary sm" type="button" data-action="new-partner" data-id="${selected.id}">+ Socio</button></div>
        ${partners.length ? `<div class="table-wrap"><table class="compact-table">
          <thead><tr><th>Nombre</th><th class="r">%</th><th>Rol</th></tr></thead>
          <tbody>${partners.map(p => `<tr class="row-hover" data-action="edit-partner" data-id="${p.id}" data-parent="${selected.id}"><td><strong>${esc(p.name)}</strong></td><td class="r num">${fmtPct(p.share)}</td><td class="muted">${esc(p.role || "")}</td></tr>`).join("")}</tbody>
        </table></div>` : `<div class="empty">Sin socios cargados.</div>`}
      </div>
    </div>
  `;
}

function openPalette() {
  document.getElementById("palette").classList.add("open");
  document.getElementById("paletteBackdrop").classList.add("open");
  const input = document.getElementById("paletteInput");
  input.value = "";
  paletteIdx = 0;
  renderPalette();
  setTimeout(() => input.focus(), 30);
}
function closePalette() {
  document.getElementById("palette").classList.remove("open");
  document.getElementById("paletteBackdrop").classList.remove("open");
}
function renderPalette() {
  const q = document.getElementById("paletteInput").value.trim().toLowerCase();
  const all = buildCommands();
  paletteVisible = q ? all.filter(c => c.label.toLowerCase().includes(q) || c.group.toLowerCase().includes(q)) : all;
  if (!paletteVisible.length) {
    document.getElementById("paletteList").innerHTML = `<div class="palette-empty">Sin resultados</div>`;
    return;
  }
  const groups = {};
  paletteVisible.forEach((c, i) => {
    if (!groups[c.group]) groups[c.group] = [];
    groups[c.group].push({ ...c, _idx: i });
  });
  document.getElementById("paletteList").innerHTML = Object.entries(groups).map(([g, items]) => `
    <div class="palette-section">${esc(g)}</div>
    ${items.map(it => `<button class="palette-item ${it._idx === paletteIdx ? "active" : ""}" data-palette-idx="${it._idx}"><span>${esc(it.label)}</span><span class="desc">${esc(it.desc || "")}</span></button>`).join("")}
  `).join("");
}
function paletteRun(i) {
  const c = paletteVisible[i];
  if (!c) return;
  closePalette();
  setTimeout(() => c.run(), 30);
}

        cashDelta: -(i.downPayment || 0),
        debtAdded: principal,
        monthlyDebtAdded: cuota,
        monthlyFlowDelta: -(cuota + (i.monthlyExtraCost || 0)),

/* ============================================================
   ENGINE: projection de patrimonio y verdict
   ============================================================ */

function projectNetWorth(months, deltas) {
  const cap = calcCapital();
  const cf = calcCashflow();
  const d = deltas || {};
  // Punto de partida post-decisión (instantáneo)
  const startNW = cap.netWorth + (d.cashDelta || 0) - (d.debtAdded || 0) + (d.assetAdded || 0);
  // Acumulación mensual: flujo libre post + ingreso pasivo
  const monthlyDelta = cf.freeFlow + (d.monthlyFlowDelta || 0);
  // Crecimiento de activos invertidos (líquidos + APV) — modelo simple lineal
  const invested = (cap.byClass.fund || 0) + (cap.byClass.etf || 0) + (cap.byClass.stock || 0) + (cap.byClass.apv || 0) + (cap.byClass.crypto || 0);
  const assumedAnnualReturn = 0.06; // conservador
  const monthlyAssetGrowth = invested * (assumedAnnualReturn / 12);
  // Apreciación inmobiliaria (incluyendo nuevo activo si es propiedad)
  const reExposure = (cap.byClass.real_estate || 0) + ((d.assetAdded || 0) > 0 ? (d.assetAdded || 0) : 0);
  const assumedReAppreciation = 0.03;
  const monthlyReGrowth = reExposure * (assumedReAppreciation / 12);
  // Net worth proyectado
  return startNW + (monthlyDelta + monthlyAssetGrowth + monthlyReGrowth) * months;
}

function makeVerdict(deltas, st) {
  const cap = calcCapital();
  const cf = calcCashflow();
  const d = deltas || {};
  const cashPost = cap.fastLiquidValue + (d.cashDelta || 0);
  const flowPost = cf.freeFlow + (d.monthlyFlowDelta || 0);
  const debtServicePost = cf.debtService + (d.monthlyDebtAdded || 0);
  const dtiPost = cf.income > 0 ? debtServicePost / cf.income : 0;
  const burnPost = cf.burn + (d.monthlyDebtAdded || 0);
  const runwayPost = burnPost > 0 ? cashPost / burnPost : 99;
  const reserveTarget = burnPost * (st.settings.reserveMonths || 6);

  const issues = [];
  const conditions = [];

  if (cashPost < 0) {
    issues.push({ level: "critical", text: "No tenés cash suficiente: faltan " + fmtShort(-cashPost) });
    conditions.push("Conseguir " + fmtShort(-cashPost) + " adicionales en cash rápido");
  }
  if (flowPost < 0) {
    issues.push({ level: "critical", text: "Flujo libre quedaría negativo: " + fmtShort(flowPost) + "/mes" });
    conditions.push("Reducir gastos o aumentar ingresos en " + fmtShort(-flowPost) + "/mes");
  }
  if (dtiPost > 0.40) {
    issues.push({ level: "critical", text: "DTI subiría a " + fmtPct(dtiPost) + " (sobre 40% es zona alto riesgo)" });
    conditions.push("DTI máximo objetivo 35%. Bajar deuda actual o aumentar ingreso");
  }

  if (cashPost >= 0 && cashPost < reserveTarget * 0.5) {
    issues.push({ level: "warning", text: "Liquidez post quedaría bajo medio colchón (3m burn)" });
    conditions.push("Tener " + fmtShort(reserveTarget * 0.5 - cashPost) + " más en cash antes");
  }
  if (runwayPost < 3 && runwayPost >= 0) {
    issues.push({ level: "warning", text: "Runway bajaría a " + runwayPost.toFixed(1) + " meses" });
  }
  if (dtiPost > 0.30 && dtiPost <= 0.40) {
    issues.push({ level: "warning", text: "DTI subiría a " + fmtPct(dtiPost) + " (zona ajustada)" });
  }
  if (flowPost > 0 && flowPost < cf.freeFlow * 0.3) {
    issues.push({ level: "warning", text: "Flujo libre bajaría >70% (" + fmtShort(cf.freeFlow) + " → " + fmtShort(flowPost) + ")" });
  }

  const hasCritical = issues.some(i => i.level === "critical");
  const hasWarning = issues.some(i => i.level === "warning");

  let level, label;
  if (hasCritical) { level = "no"; label = "No conviene ahora"; }
  else if (hasWarning) { level = "wait"; label = "Esperar / mejorar condiciones"; }
  else { level = "viable"; label = "Viable"; }

  return { level, label, issues, conditions };
}
