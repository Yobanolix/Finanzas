<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <title>Wealth OS v0.3</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090b;
      --panel: #0d0f12;
      --panel-2: #11141a;
      --panel-3: #151922;
      --line: rgba(255, 255, 255, 0.06);
      --line-strong: rgba(255, 255, 255, 0.12);
      --text: #f5f7fb;
      --soft: #c7ccd5;
      --muted: #8b929f;
      --faint: #626b78;
      --accent: #5e90ff;
      --green: #55d58a;
      --red: #ff6b6b;
      --amber: #e7bd58;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter Variable", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    button {
      cursor: pointer;
    }

    .shell {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px 16px;
      border-right: 0.5px solid var(--line);
      background: #090a0d;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 40px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 0.5px solid var(--line-strong);
      border-radius: 8px;
      color: var(--accent);
      font-size: 17px;
      font-weight: 700;
    }

    .brand-title {
      display: grid;
      gap: 2px;
      line-height: 1;
      font-size: 14px;
      font-weight: 650;
    }

    .brand-title span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .nav {
      display: grid;
      gap: 4px;
    }

    .nav button {
      display: grid;
      grid-template-columns: 20px 1fr;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 36px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      font-size: 13px;
    }

    .nav button:hover,
    .nav button.active {
      background: var(--panel-2);
      color: var(--text);
    }

    .nav-index {
      color: var(--faint);
      font-size: 11px;
    }

    .side-card {
      margin-top: auto;
      display: grid;
      gap: 12px;
      padding: 12px;
      border: 0.5px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .side-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .side-row strong {
      color: var(--text);
      font-weight: 650;
    }

    .main {
      min-width: 0;
      padding: 20px 24px 48px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 8;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 0 0 20px;
      background: var(--bg);
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.08;
      font-weight: 720;
    }

    h2 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 680;
    }

    h3 {
      margin: 0;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 680;
    }

    p {
      margin: 0;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn,
    .icon-btn,
    .chip {
      border: 0.5px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      min-height: 36px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 620;
      white-space: nowrap;
    }

    .btn:hover,
    .icon-btn:hover,
    .chip:hover {
      border-color: rgba(94, 144, 255, 0.42);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #061021;
    }

    .btn.ghost {
      background: transparent;
      color: var(--muted);
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 36px;
      padding: 0;
      color: var(--muted);
    }

    .kbd {
      display: inline-grid;
      place-items: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border: 0.5px solid var(--line-strong);
      border-radius: 6px;
      color: var(--muted);
      background: #0a0c10;
      font-size: 11px;
    }

    .view {
      display: grid;
      gap: 16px;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .grid.cols-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid.cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .metric {
      display: grid;
      gap: 8px;
      min-height: 108px;
      padding: 16px;
      border: 0.5px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .metric label {
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      color: var(--text);
      font-size: 22px;
      line-height: 1.1;
      font-weight: 700;
    }

    .metric small {
      color: var(--faint);
      font-size: 12px;
      line-height: 1.35;
    }

    .panel {
      display: grid;
      gap: 16px;
      padding: 16px;
      border: 0.5px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      min-width: 0;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .panel-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .stack {
      display: grid;
      gap: 8px;
    }

    .split {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
      gap: 16px;
      align-items: start;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 32px;
    }

    .row + .row {
      border-top: 0.5px solid var(--line);
      padding-top: 8px;
    }

    .muted {
      color: var(--muted);
    }

    .faint {
      color: var(--faint);
    }

    .num {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .good {
      color: var(--green);
    }

    .bad {
      color: var(--red);
    }

    .warn {
      color: var(--amber);
    }

    .accent {
      color: var(--accent);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 0 8px;
      border: 0.5px solid var(--line-strong);
      border-radius: 999px;
      color: var(--soft);
      background: #0a0c10;
      font-size: 11px;
      white-space: nowrap;
    }

    .badge.good {
      color: var(--green);
      border-color: rgba(85, 213, 138, 0.26);
    }

    .badge.bad {
      color: var(--red);
      border-color: rgba(255, 107, 107, 0.26);
    }

    .badge.warn {
      color: var(--amber);
      border-color: rgba(231, 189, 88, 0.26);
    }

    .progress {
      display: grid;
      gap: 8px;
    }

    .bar {
      position: relative;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #090b0f;
      border: 0.5px solid var(--line);
    }

    .bar span {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--w, 0%);
      max-width: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    .bar.green span {
      background: var(--green);
    }

    .bar.red span {
      background: var(--red);
    }

    .bar.amber span {
      background: var(--amber);
    }

    .table-wrap {
      overflow-x: auto;
      border: 0.5px solid var(--line);
      border-radius: 8px;
    }

    .table-wrap.compact {
      overflow-x: hidden;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
    }

    table.compact-table {
      min-width: 0;
      table-layout: fixed;
    }

    table.compact-table th,
    table.compact-table td {
      padding: 10px 8px;
      white-space: normal;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 0.5px solid var(--line);
      text-align: left;
      vertical-align: middle;
      font-size: 12px;
    }

    th {
      color: var(--muted);
      font-weight: 620;
      background: #0a0c10;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td:last-child,
    th:last-child {
      text-align: right;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      font-size: 12px;
      color: var(--muted);
    }

    .chip.active {
      background: rgba(94, 144, 255, 0.12);
      border-color: rgba(94, 144, 255, 0.46);
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    label.field {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 38px;
      padding: 0 10px;
      border: 0.5px solid var(--line-strong);
      border-radius: 8px;
      background: #090b0f;
      color: var(--text);
      outline: none;
    }

    textarea {
      min-height: 144px;
      padding: 10px;
      resize: vertical;
      line-height: 1.45;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(94, 144, 255, 0.62);
    }

    .drawer-backdrop,
    .palette-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      background: rgba(0, 0, 0, 0.42);
    }

    .drawer-backdrop.open,
    .palette-backdrop.open {
      display: block;
    }

    .drawer {
      position: fixed;
      z-index: 50;
      top: 0;
      right: 0;
      width: min(520px, 100vw);
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      transform: translateX(100%);
      transition: transform 120ms ease;
      border-left: 0.5px solid var(--line-strong);
      background: #090a0d;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 20px;
      border-bottom: 0.5px solid var(--line);
    }

    .drawer-body {
      overflow: auto;
      padding: 20px;
    }

    .palette {
      position: fixed;
      z-index: 60;
      left: 50%;
      top: 12vh;
      width: min(640px, calc(100vw - 32px));
      display: none;
      transform: translateX(-50%);
      border: 0.5px solid var(--line-strong);
      border-radius: 8px;
      background: #090a0d;
    }

    .palette.open {
      display: grid;
    }

    .palette input {
      border: 0;
      border-bottom: 0.5px solid var(--line);
      border-radius: 8px 8px 0 0;
      min-height: 52px;
      padding: 0 16px;
      background: transparent;
      font-size: 14px;
    }

    .palette-list {
      display: grid;
      gap: 4px;
      padding: 8px;
    }

    .palette-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 40px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--soft);
      text-align: left;
    }

    .palette-item.active,
    .palette-item:hover {
      background: var(--panel-2);
      color: var(--text);
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 70;
      display: none;
      max-width: 340px;
      padding: 12px 14px;
      border: 0.5px solid var(--line-strong);
      border-radius: 8px;
      background: #090a0d;
      color: var(--text);
      font-size: 12px;
    }

    .toast.open {
      display: block;
    }

    .drop-zone {
      position: fixed;
      inset: 12px;
      z-index: 80;
      display: none;
      place-items: center;
      border: 0.5px solid rgba(94, 144, 255, 0.62);
      border-radius: 8px;
      background: rgba(8, 9, 11, 0.88);
      color: var(--text);
      font-size: 17px;
    }

    .drop-zone.open {
      display: grid;
    }

    @media (max-width: 1060px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
        padding: 12px;
        border-right: 0;
        border-bottom: 0.5px solid var(--line);
      }

      .nav {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .nav button {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
        padding: 8px 6px;
      }

      .nav-index {
        display: none;
      }

      .side-card {
        display: none;
      }

      .main {
        padding: 16px 12px 40px;
      }

      .split,
      .grid.cols-2,
      .grid.cols-3,
      .grid.cols-4 {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 22px;
      }

      .topbar {
        position: static;
        display: grid;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .nav {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .metric {
        min-height: 96px;
      }

      .metric strong {
        font-size: 17px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">

          <button class="btn" type="button" data-action="open-settings">Rates</button>
          <button class="btn primary" type="button" data-action="export-json">Backup</button>
        </div>
      </header>

      <section class="view" id="app"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div>

        <p class="panel-sub" id="drawerSub"></p>

      <button class="icon-btn" type="button" data-action="close-drawer" aria-label="Cerrar">Esc</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <div class="palette-backdrop" id="paletteBackdrop"></div>
  <div class="palette" id="palette" role="dialog" aria-label="Command palette">
    <input id="paletteInput" autocomplete="off" placeholder="Buscar accion, vista o simulacion">
    <div class="palette-list" id="paletteList"></div>

  <div class="drop-zone" id="dropZone">Suelta un backup JSON para importarlo</div>
  <div class="toast" id="toast"></div>

    let state = loadState();
    let paletteIndex = 0;
    let toastTimer = 0;

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return clone(seedState);
        const parsed = JSON.parse(raw);
        return normalizeState(parsed);
      } catch (error) {
        return clone(seedState);
      }
    }

    function normalizeState(value) {
      const next = { ...clone(seedState), ...value };
      next.ui = { ...clone(seedState.ui), ...(value.ui || {}) };
      next.settings = { ...clone(seedState.settings), ...(value.settings || {}) };
      next.cashflow = {
        income: value.cashflow?.income || clone(seedState.cashflow.income),
        expenses: value.cashflow?.expenses || clone(seedState.cashflow.expenses)
      };
      next.assets = value.assets || clone(seedState.assets);
      next.liabilities = value.liabilities || clone(seedState.liabilities);
      next.businesses = value.businesses || clone(seedState.businesses);
      next.goals = value.goals || clone(seedState.goals);
      next.decisionDrafts = value.decisionDrafts || {};
      return next;
    }

    function saveState() {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }

    function uid(prefix) {
      return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
    }

    function rate(currency) {
      if (currency === "USD") return Number(state.settings.usd || 0);
      if (currency === "UF") return Number(state.settings.uf || 0);
      return 1;
    }

    function toCLP(amount, currency = "CLP") {
      return Number(amount || 0) * rate(currency);
    }

    function money(value) {
      const safe = Number.isFinite(value) ? value : 0;
      return new Intl.NumberFormat("es-CL", {
        style: "currency",
        currency: "CLP",
        maximumFractionDigits: 0
      }).format(Math.round(safe));
    }

    function pct(value) {
      if (!Number.isFinite(value)) return "0%";
      return new Intl.NumberFormat("es-CL", {
        style: "percent",
        maximumFractionDigits: 1
      }).format(value);
    }

    function monthsLabel(months) {
      if (!Number.isFinite(months)) return "No alcanza";
      if (months <= 0) return "Listo";
      if (months < 12) return `${Math.ceil(months)} meses`;
      return `${Math.floor(months / 12)}a ${Math.ceil(months % 12)}m`;
    }

    function signedMonths(delta) {
      if (!Number.isFinite(delta)) return "No alcanza";
      if (Math.abs(delta) < 1) return "sin cambio";
      const rounded = Math.round(delta);
      return rounded > 0 ? `retrasa ${rounded}m` : `adelanta ${Math.abs(rounded)}m`;
    }

    function calcPayment(principal, annualRate, months) {
      const p = Number(principal || 0);
      const r = Number(annualRate || 0) / 12;
      const n = Math.max(1, Number(months || 1));
      if (r === 0) return p / n;
      return p * (r / (1 - Math.pow(1 + r, -n)));
    }

    function balanceAfter(principal, annualRate, monthsTotal, monthsPaid, payment) {
      const r = Number(annualRate || 0) / 12;
      const p = Number(principal || 0);
      const paid = Math.min(Number(monthsPaid || 0), Number(monthsTotal || 0));
      if (r === 0) return Math.max(0, p - payment * paid);
      return Math.max(0, p * Math.pow(1 + r, paid) - payment * ((Math.pow(1 + r, paid) - 1) / r));
    }

    function assetValue(asset) {
      return toCLP(asset.value, asset.currency);
    }

    function liabilityBalance(liability) {
      return toCLP(liability.balance, liability.currency);
    }

    function liabilityPayment(liability) {
      if (Number(liability.monthlyPayment || 0) > 0) return toCLP(liability.monthlyPayment, liability.currency);
      return calcPayment(liabilityBalance(liability), liability.annualRate, Number(liability.yearsLeft || 0) * 12);
    }

    function calcBusiness(biz, stress = 1) {
      const rows = biz.products.map((product) => {
        const units = Math.max(0, Number(product.units || 0) * stress);
        const revenue = Number(product.price || 0) * units;
        const variable = Number(product.unitCost || 0) * units + revenue * Number(product.feePct || 0);
        const contribution = revenue - variable;
        return { ...product, units, revenue, variable, contribution };
      });
      const revenue = rows.reduce((sum, row) => sum + row.revenue, 0);
      const variable = rows.reduce((sum, row) => sum + row.variable, 0);
      const gross = revenue - variable;
      const fixed = biz.fixedCosts.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const ownerDraw = Number(biz.ownerDraw || 0);
      const netBeforeDraw = gross - fixed;
      const netAfterDraw = netBeforeDraw - ownerDraw;
      const grossMargin = revenue > 0 ? gross / revenue : 0;
      const netMargin = revenue > 0 ? netAfterDraw / revenue : 0;
      const totalUnits = rows.reduce((sum, row) => sum + row.units, 0);
      const avgContribution = totalUnits > 0 ? gross / totalUnits : 0;
      const breakEvenUnits = avgContribution > 0 ? fixed / avgContribution : Infinity;
      const breakEvenRevenue = grossMargin > 0 ? fixed / grossMargin : Infinity;
      const runway = netAfterDraw < 0 ? Number(biz.cash || 0) / Math.abs(netAfterDraw) : Infinity;
      const payback = netBeforeDraw > 0 ? Number(biz.initialInvestment || 0) / netBeforeDraw : Infinity;
      const value = Math.max(0, netBeforeDraw) * 12 * Number(biz.valuationMultiple || 1) + Number(biz.cash || 0);
      const ownerValue = value * Number(biz.ownerShare || 0);
      return { biz, rows, revenue, variable, gross, fixed, ownerDraw, netBeforeDraw, netAfterDraw, grossMargin, netMargin, breakEvenUnits, breakEvenRevenue, runway, payback, value, ownerValue };
    }

    function calcAll() {
      const assets = state.assets.map((asset) => ({ ...asset, valueCLP: assetValue(asset) }));
      const liabilities = state.liabilities.map((item) => ({ ...item, balanceCLP: liabilityBalance(item), paymentCLP: liabilityPayment(item) }));
      const businessMetrics = state.businesses.map((biz) => calcBusiness(biz));
      const assetTotal = assets.reduce((sum, asset) => sum + asset.valueCLP, 0);
      const debtTotal = liabilities.reduce((sum, item) => sum + item.balanceCLP, 0);
      const debtPayment = liabilities.reduce((sum, item) => sum + item.paymentCLP, 0);
      const businessValue = businessMetrics.reduce((sum, metric) => sum + metric.ownerValue, 0);
      const liquid = assets.filter((asset) => ["immediate", "two_days", "thirty_days"].includes(asset.liquidity)).reduce((sum, asset) => sum + asset.valueCLP, 0);
      const immediate = assets.filter((asset) => asset.liquidity === "immediate").reduce((sum, asset) => sum + asset.valueCLP, 0);
      const passiveIncome = assets.reduce((sum, asset) => sum + Number(asset.monthlyIncome || 0), 0);
      const businessIncome = state.businesses.reduce((sum, biz) => sum + Number(biz.ownerDraw || 0) * Number(biz.ownerShare || 0), 0);
      const activeIncome = state.cashflow.income.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const income = activeIncome + passiveIncome + businessIncome;
      const expenses = state.cashflow.expenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const fixedBurn = expenses + debtPayment;
      const freeCash = income - fixedBurn;
      const investable = Math.max(0, freeCash);
      const reserveTarget = fixedBurn * Number(state.settings.reserveMonths || 6);
      const netWorth = assetTotal + businessValue - debtTotal;
      const runway = fixedBurn > 0 ? liquid / fixedBurn : Infinity;
      const dti = income > 0 ? debtPayment / income : 0;
      const savingsRate = income > 0 ? investable / income : 0;
      const byClass = groupSum(assets, "class", "valueCLP");
      const byCurrency = groupSum(assets, "currency", "valueCLP");
      const investedCapital = assets.filter((asset) => ["fund", "etf", "stock", "apv", "crypto", "private"].includes(asset.class)).reduce((sum, asset) => sum + asset.valueCLP, 0);
      return { assets, liabilities, businessMetrics, assetTotal, debtTotal, debtPayment, businessValue, liquid, immediate, passiveIncome, businessIncome, activeIncome, income, expenses, fixedBurn, freeCash, investable, reserveTarget, netWorth, runway, dti, savingsRate, byClass, byCurrency, investedCapital };
    }

    function groupSum(items, key, valueKey) {
      return items.reduce((acc, item) => {
        const id = item[key] || "other";
        acc[id] = (acc[id] || 0) + Number(item[valueKey] || 0);
        return acc;
      }, {});
    }

    function monthsToGoal(current, target, monthly, annualReturn) {
      let value = Number(current || 0);
      const goal = Number(target || 0);
      const contribution = Number(monthly || 0);
      const r = Number(annualReturn || 0) / 12;
      if (value >= goal) return 0;
      if (contribution <= 0 && r <= 0) return Infinity;
      for (let month = 1; month <= 600; month += 1) {
        value = value * (1 + r) + contribution;
        if (value >= goal) return month;
      }
      return Infinity;
    }

    function goalCurrent(goal, data) {
      if (goal.type === "asset_down" || goal.type === "liquidity") return data.liquid;
      if (goal.type === "invested_capital") return data.investedCapital;
      if (goal.type === "passive_income") return data.passiveIncome;
      return Number(goal.current || 0);
    }

    function goalMonthly(goal, investable) {
      if (goal.type === "passive_income") return Math.max(0, investable * Number(goal.allocation || 0)) * 0.004;
      return Math.max(0, investable * Number(goal.allocation || 1));
    }

    function getDecisionDraft(templateId) {
      const template = decisionTemplates[templateId];
      const defaults = Object.fromEntries(template.fields.map(([key, label, value]) => [key, value]));
      return { ...defaults, ...(state.decisionDrafts[templateId] || {}) };
    }

    function runScenario(templateId) {
      const data = calcAll();
      const draft = getDecisionDraft(templateId);
      const result = {
        id: templateId,
        label: decisionTemplates[templateId].label,
        upfront: 0,
        monthlyImpact: 0,
        debtAdded: 0,
        assetAdded: 0,
        wealthDelta12: 0,
        risk: [],
        conditions: [],
        notes: []
      };

      if (templateId === "car") {
        const price = Number(draft.purchasePrice || 0);
        const down = Number(draft.downPayment || 0);
        const loan = Math.max(0, price - down);
        const payment = calcPayment(loan, Number(draft.annualRate || 0), Number(draft.months || 1));
        const remaining = balanceAfter(loan, Number(draft.annualRate || 0), Number(draft.months || 1), 12, payment);
        const resale = price * Number(draft.resalePct12m || 0.75);
        result.upfront = down;
        result.monthlyImpact = -(payment + Number(draft.monthlyExtraCost || 0));
        result.debtAdded = loan;
        result.assetAdded = resale;
        result.wealthDelta12 = resale - remaining - down - Number(draft.monthlyExtraCost || 0) * 12;
        result.risk.push("Depreciacion + costo fijo mensual");
        result.conditions.push("No bajar runway bajo 6 meses");
        result.conditions.push("Compensar al menos 50% del costo mensual con ingreso nuevo");
      }

      if (templateId === "property") {
        const price = Number(draft.priceUF || 0) * Number(state.settings.uf || 0);
        const down = price * Number(draft.downPct || 0);
        const closing = price * Number(draft.closingPct || 0);
        const loan = Math.max(0, price - down);
        const payment = calcPayment(loan, Number(draft.annualRate || 0), Number(draft.years || 0) * 12);
        const netRent = Number(draft.rentCLP || 0) * (1 - Number(draft.vacancyPct || 0)) - Number(draft.costsCLP || 0);
        const remaining = balanceAfter(loan, Number(draft.annualRate || 0), Number(draft.years || 0) * 12, 12, payment);
        const principalPaid = loan - remaining;
        const appreciation = price * Number(draft.appreciation || 0);
        result.upfront = down + closing;
        result.monthlyImpact = netRent - payment;
        result.debtAdded = loan;
        result.assetAdded = price;
        result.wealthDelta12 = principalPaid + appreciation + result.monthlyImpact * 12 - closing;
        result.risk.push("Vacancia, tasa y liquidez baja");
        result.conditions.push("Comprar solo si DTI post decision queda bajo 40%");
        result.conditions.push("Mantener caja personal sobre 6 meses de runway");
      }

      if (templateId === "business") {
        const upfront = Number(draft.initialCash || 0);
        const burn = Number(draft.monthlyBurn || 0);
        const breakeven = Number(draft.monthsToBreakeven || 0);
        const profit = Number(draft.profitAfterBreakeven || 0);
        const share = Number(draft.ownerShare || 0);
        const success = Number(draft.successProbability || 0);
        const multiple = Number(draft.multiple || 1);
        const monthsProfit = Math.max(0, 12 - breakeven);
        const expectedProfit = (profit * monthsProfit - burn * breakeven) * share * success;
        const expectedValue = Math.max(0, profit * 12 * multiple * share * success);
        result.upfront = upfront;
        result.monthlyImpact = -burn;
        result.assetAdded = expectedValue;
        result.wealthDelta12 = expectedProfit + expectedValue - upfront;
        result.risk.push("Ejecucion, demanda y caja familiar");
        result.conditions.push("Separar caja del negocio y caja personal desde el dia 1");
        result.conditions.push("Definir por escrito recuperacion de capital antes de repartir utilidades");
      }

      if (templateId === "invest") {
        const extra = Number(draft.extraMonthly || 0);
        const r = Number(draft.annualReturn || 0) / 12;
        const months = Number(draft.months || 0);
        const fv = r === 0 ? extra * months : extra * ((Math.pow(1 + r, months) - 1) / r);
        result.upfront = 0;
        result.monthlyImpact = -extra;
        result.assetAdded = fv;
        result.wealthDelta12 = extra * 12 * (1 + Number(draft.annualReturn || 0) / 2);
        result.risk.push("Menor flexibilidad mensual");
        result.conditions.push("Automatizar solo si flujo libre sigue positivo");
      }

      if (templateId === "prepay") {
        const prepay = Number(draft.prepayAmount || 0);
        const monthlyDrop = Number(draft.monthlyPayment || 0) * Number(draft.reducePaymentPct || 0);
        const interestSaved = prepay * Number(draft.annualRate || 0) * Math.min(Number(draft.yearsLeft || 0), 1.8);
        result.upfront = prepay;
        result.monthlyImpact = monthlyDrop;
        result.debtAdded = -prepay;
        result.wealthDelta12 = interestSaved + monthlyDrop * 12;
        result.risk.push("Baja liquidez por prepago");
        result.conditions.push("Prepagar solo si sobra caja sobre el fondo de seguridad");
      }

      result.liquidityAfter = data.liquid - result.upfront;
      result.freeCashAfter = data.freeCash + result.monthlyImpact;
      result.investableAfter = Math.max(0, data.investable + result.monthlyImpact);
      result.debtPaymentAfter = data.debtPayment + Math.max(0, -Math.min(0, result.monthlyImpact));
      result.dtiAfter = data.income > 0 ? Math.max(0, data.debtPayment + Math.max(0, -result.monthlyImpact * 0.62)) / data.income : 0;
      result.runwayAfter = data.fixedBurn > 0 ? result.liquidityAfter / data.fixedBurn : Infinity;
      result.goalImpacts = state.goals.map((goal) => {
        const baseCurrent = goalCurrent(goal, data);
        const scenarioCurrent = ["asset_down", "liquidity"].includes(goal.type) ? baseCurrent - result.upfront : baseCurrent;
        let baseMonthly = goalMonthly(goal, data.investable);
        let scenarioMonthly = goalMonthly(goal, result.investableAfter);
        if (templateId === "invest" && goal.type === "invested_capital") scenarioMonthly = baseMonthly + Number(draft.extraMonthly || 0);
        if (templateId === "business" && goal.type === "passive_income") scenarioMonthly = baseMonthly + Math.max(0, Number(draft.profitAfterBreakeven || 0) * Number(draft.ownerShare || 0) * 0.22);
        const baseMonths = monthsToGoal(baseCurrent, goal.target, baseMonthly, goal.annualReturn);
        const scenarioMonths = monthsToGoal(Math.max(0, scenarioCurrent), goal.target, scenarioMonthly, goal.annualReturn);
        return { goal, baseMonths, scenarioMonths, delta: scenarioMonths - baseMonths };
      });

      const hardFail = result.liquidityAfter < data.reserveTarget || result.freeCashAfter < 0 || result.dtiAfter > 0.44;
      const medium = result.runwayAfter < 8 || result.wealthDelta12 < 0 || result.dtiAfter > 0.36;
      if (hardFail) {
        result.verdict = "No ahora";
        result.tone = "bad";
      } else if (medium) {
        result.verdict = "Esperar o ajustar";
        result.tone = "warn";
      } else {
        result.verdict = "Viable";
        result.tone = "good";
      }
      return result;
    }

    function buildTodayActions(data) {
      const list = [];
      if (data.liquid < data.reserveTarget) {
        list.push({ title: "Blindar caja antes de deuda nueva", body: `Faltan ${money(data.reserveTarget - data.liquid)} para una reserva de ${state.settings.reserveMonths} meses.`, label: "prioridad", tone: "warn" });
      } else {
        list.push({ title: "Puedes mover capital", body: `Caja sobre reserva por ${money(data.liquid - data.reserveTarget)}. Simula auto, depto o negocio sin miedo a ciegas.`, label: "listo", tone: "good" });
      }
      if (data.dti > 0.36) {
        list.push({ title: "No sumar deuda fija", body: `DTI actual ${pct(data.dti)}. Un credito grande te aprieta demasiado.`, label: "riesgo", tone: "bad" });
      } else {

      if (business && business.netAfterDraw > 0) {

      return list.slice(0, 3);

    }

    function openImportForm() {
      openDrawer("Importar backup", "Pega un JSON exportado de Wealth OS.", `
        <form class="stack" data-form="import">
          <textarea name="json" placeholder="{...}"></textarea>
          <button class="btn primary" type="submit">Importar</button>
        </form>
      `);
    }

    function currentBusiness() {
      return state.businesses.find((biz) => biz.id === state.ui.businessId) || state.businesses[0];
    }

    function handleFormSubmit(form) {
      const fd = new FormData(form);
      const type = form.dataset.form;
      if (type === "asset") {
        state.assets.push({
          id: uid("asset"),
          name: fd.get("name"),
          class: fd.get("class"),
          currency: fd.get("currency"),
          value: Number(fd.get("value")),
          annualReturn: Number(fd.get("annualReturn")),
          monthlyIncome: Number(fd.get("monthlyIncome")),
          liquidity: fd.get("liquidity"),
          risk: fd.get("risk")
        });
      }
      if (type === "liability") {
        state.liabilities.push({
          id: uid("liability"),
          name: fd.get("name"),
          type: fd.get("type"),
          currency: fd.get("currency"),
          balance: Number(fd.get("balance")),
          annualRate: Number(fd.get("annualRate")),
          yearsLeft: Number(fd.get("yearsLeft")),
          monthlyPayment: Number(fd.get("monthlyPayment"))
        });
      }
      if (type === "income") {
        state.cashflow.income.push({ id: uid("income"), name: fd.get("name"), amount: Number(fd.get("amount")), stable: fd.get("stable") === "true" });
      }
      if (type === "expense") {
        state.cashflow.expenses.push({ id: uid("expense"), name: fd.get("name"), amount: Number(fd.get("amount")), type: fd.get("type") });
      }
      if (type === "product") {
        const biz = currentBusiness();
        biz.products.push({ id: uid("product"), name: fd.get("name"), price: Number(fd.get("price")), unitCost: Number(fd.get("unitCost")), units: Number(fd.get("units")), feePct: Number(fd.get("feePct")) });
      }
      if (type === "fixedCost") {
        const biz = currentBusiness();
        biz.fixedCosts.push({ id: uid("fixed"), name: fd.get("name"), amount: Number(fd.get("amount")) });
      }
      if (type === "settings") {
        state.settings.usd = Number(fd.get("usd"));
        state.settings.uf = Number(fd.get("uf"));
        state.settings.reserveMonths = Number(fd.get("reserveMonths"));
      }
      if (type === "import") {
        const imported = JSON.parse(fd.get("json"));
        state = normalizeState(imported);
      }
      saveState();
      closeDrawer();
      render();
      showToast("Guardado");
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `wealth-os-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("Backup exportado");
    }

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("open");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("open"), 2200);
    }

    function actions() {
      return [
        ...modules.map((item) => ({ label: `Ir a ${item.label}`, hint: item.question, run: () => setView(item.id) })),
        { label: "Agregar activo", hint: "Caja, fondo, ETF, APV o propiedad", run: openAssetForm },
        { label: "Agregar deuda", hint: "Credito, hipotecario o auto", run: openLiabilityForm },
        { label: "Agregar ingreso", hint: "Nueva linea de cashflow", run: () => openCashflowForm("income") },
        { label: "Agregar gasto", hint: "Nueva salida mensual", run: () => openCashflowForm("expense") },
        { label: "Agregar producto al negocio", hint: "Precio, costo, unidades y fee", run: openProductForm },
        { label: "Simular auto", hint: "Decision Lab", run: () => setDecision("car") },
        { label: "Simular segundo depto", hint: "Decision Lab", run: () => setDecision("property") },
        { label: "Simular emprendimiento", hint: "Decision Lab", run: () => setDecision("business") },
        { label: "Exportar backup", hint: "JSON local", run: exportJSON },
        { label: "Importar backup", hint: "Pegar JSON", run: openImportForm },
        { label: "Editar rates", hint: "USD, UF y reserva", run: openSettingsForm }
      ];
    }

    function openPalette() {
      paletteIndex = 0;
      document.getElementById("palette").classList.add("open");
      document.getElementById("paletteBackdrop").classList.add("open");
      document.getElementById("paletteInput").value = "";
      renderPalette();
      setTimeout(() => document.getElementById("paletteInput").focus(), 0);
    }

    function closePalette() {
      document.getElementById("palette").classList.remove("open");
      document.getElementById("paletteBackdrop").classList.remove("open");
    }

    function renderPalette() {
      const query = document.getElementById("paletteInput").value.trim().toLowerCase();
      const list = actions().filter((item) => fuzzy(query, `${item.label} ${item.hint}`)).slice(0, 9);
      document.getElementById("paletteList").innerHTML = list.map((item, index) => `
        <button class="palette-item ${index === paletteIndex ? "active" : ""}" type="button" data-palette-index="${index}">
          <span>${item.label}</span>
          <span class="muted">${item.hint}</span>
        </button>
      `).join("") || `<div class="palette-item"><span>Sin resultados</span></div>`;
    }

    function fuzzy(query, text) {
      if (!query) return true;
      const source = text.toLowerCase();
      if (source.includes(query)) return true;
      let cursor = 0;
      for (const char of query) {
        cursor = source.indexOf(char, cursor);
        if (cursor === -1) return false;
        cursor += 1;
      }
      return true;
    }

    function runPalette(index = paletteIndex) {
      const query = document.getElementById("paletteInput").value.trim().toLowerCase();
      const list = actions().filter((item) => fuzzy(query, `${item.label} ${item.hint}`)).slice(0, 9);
      const item = list[index];
      if (!item) return;
      closePalette();
      item.run();
    }

    function setView(id) {
      state.ui.view = id;
      saveState();
      render();
    }

    function setDecision(id) {
      state.ui.view = "decisions";
      state.ui.decision = id;
      saveState();
      render();
    }

    document.addEventListener("click", (event) => {
      const viewButton = event.target.closest("[data-view]");
      if (viewButton) setView(viewButton.dataset.view);

      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "open-palette") openPalette();
      if (action === "close-drawer") closeDrawer();
      if (action === "open-settings") openSettingsForm();
      if (action === "export-json") exportJSON();
      if (action === "add-asset") openAssetForm();
      if (action === "add-liability") openLiabilityForm();
      if (action === "add-income") openCashflowForm("income");
      if (action === "add-expense") openCashflowForm("expense");
      if (action === "add-product") openProductForm();
      if (action === "add-fixed-cost") openFixedCostForm();

      const template = event.target.closest("[data-template]")?.dataset.template;
      if (template) setDecision(template);

      const decision = event.target.closest("[data-decision]")?.dataset.decision;
      if (decision) setDecision(decision);

      const stress = event.target.closest("[data-stress]")?.dataset.stress;
      if (stress) {
        state.ui.stress = stress;
        saveState();
        render();
      }

      const paletteButton = event.target.closest("[data-palette-index]");
      if (paletteButton) runPalette(Number(paletteButton.dataset.paletteIndex));
    });

    document.getElementById("drawerBackdrop").addEventListener("click", closeDrawer);
    document.getElementById("paletteBackdrop").addEventListener("click", closePalette);

    document.addEventListener("submit", (event) => {
      const form = event.target.closest("form[data-form]");
      if (!form) return;
      event.preventDefault();
      try {
        handleFormSubmit(form);
      } catch (error) {
        showToast("No se pudo guardar. Revisa los datos.");
      }
    });

    document.addEventListener("input", (event) => {
      if (event.target.id === "paletteInput") {
        paletteIndex = 0;
        renderPalette();
      }
    });

    document.addEventListener("change", (event) => {
      const input = event.target.closest("[data-scenario-input]");
      if (!input) return;
      const templateId = input.dataset.templateId;
      state.decisionDrafts[templateId] = state.decisionDrafts[templateId] || {};
      state.decisionDrafts[templateId][input.dataset.scenarioInput] = Number(input.value);
      saveState();
      render();
    });

    document.addEventListener("keydown", (event) => {
      const tag = document.activeElement?.tagName;
      const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(tag);
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        openPalette();
        return;
      }
      if (!typing && event.key === "/") {
        event.preventDefault();
        openPalette();
        return;
      }
      if (event.key === "Escape") {
        closeDrawer();
        closePalette();
      }
      if (!typing && /^[1-5]$/.test(event.key)) {
        const next = modules[Number(event.key) - 1];
        if (next) setView(next.id);
      }
      if (document.getElementById("palette").classList.contains("open")) {
        if (event.key === "ArrowDown") {
          event.preventDefault();
          paletteIndex = Math.min(8, paletteIndex + 1);
          renderPalette();
        }
        if (event.key === "ArrowUp") {
          event.preventDefault();
          paletteIndex = Math.max(0, paletteIndex - 1);
          renderPalette();
        }
        if (event.key === "Enter") {
          event.preventDefault();
          runPalette();
        }
      }
    });

    window.addEventListener("dragover", (event) => {
      event.preventDefault();
      document.getElementById("dropZone").classList.add("open");
    });

    window.addEventListener("dragleave", () => {
      document.getElementById("dropZone").classList.remove("open");
    });

    window.addEventListener("drop", async (event) => {
      event.preventDefault();
      document.getElementById("dropZone").classList.remove("open");
      const file = event.dataTransfer.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        state = normalizeState(JSON.parse(text));
        saveState();
        render();
        showToast("Backup importado");
      } catch (error) {
        showToast("Archivo no valido");
      }
    });

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    render();
  </script>
</body>
</html>
