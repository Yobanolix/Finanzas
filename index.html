/* ============================================================
   PERSISTENCE: EXPORT / IMPORT / RESET / WIPE
   ============================================================ */
function exportJSON() {
  const payload = { app: "wealth_os", version: SCHEMA_VERSION, exportedAt: new Date().toISOString(), state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url; a.download = `wealth-os-${stamp}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
  toast("Backup descargado", "good");
}

function triggerImport() {
  let inp = document.getElementById("importInputHidden");
  if (!inp) {
    inp = document.createElement("input");
    inp.id = "importInputHidden";
    inp.type = "file";
    inp.accept = "application/json,.json";
    inp.style.display = "none";
    inp.addEventListener("change", e => {
      const f = e.target.files?.[0];
      if (f) importFile(f);
      e.target.value = "";
    });
    document.body.appendChild(inp);
  }
  inp.click();
}

function importFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      const payload = parsed.state ? parsed.state : parsed;
      if (!payload || typeof payload !== "object") throw new Error("Formato inválido");
      confirmAction("Importar backup", "Esto reemplaza tus datos actuales. ¿Continuar?", () => {
        if (payload.schemaVersion === SCHEMA_VERSION) {
          state = ensureIds(payload);
        } else if (payload.schemaVersion === 5) {
          state = migrateFromV05(payload);
        } else if (payload.schemaVersion === 4) {
          state = migrateFromV04(payload);
        } else {
          state = migrateFromV03(payload);
          if (!Array.isArray(state.decisions)) state.decisions = [];
          if (!Array.isArray(state.tcMovements)) state.tcMovements = [];
        }
        saveState();
        closeConfirm();
        renderApp();
        toast("Datos importados", "good");
      });
    } catch (err) {
      console.error(err);
      toast("Archivo inválido: " + err.message, "bad");
    }
  };
  reader.readAsText(file);
}

function resetToDemo() {
  confirmAction("Resetear a demo", "Reemplaza todos los datos por el set demo. ¿Continuar?", () => {
    state = ensureIds(demoState());
    saveState();
    closeConfirm();
    renderApp();
    toast("Datos demo cargados", "good");
  });
}
function wipeAll() {
  confirmAction("Borrar todo", "Vas a dejar la app vacía. ¿Confirmar?", () => {
    state = ensureIds(emptyState());
    saveState();
    closeConfirm();
    renderApp();
    toast("Datos borrados", "good");
  });
}

function openRatesForm() {
  crudCtx = { entityType: "__rates__", isNew: false };
  document.getElementById("drawerTitle").textContent = "Tasas de conversión";
  document.getElementById("drawerSub").textContent = "Para conversión a CLP. Actualizá manualmente.";
  document.getElementById("drawerBody").innerHTML = `<form class="form-grid" id="entityForm" onsubmit="return false;">
    ${fInput("usd", "USD (CLP)", state.settings.usd, { type: "number", step: "0.01" })}
    ${fInput("uf", "UF (CLP)", state.settings.uf, { type: "number", step: "0.01" })}
    ${fInput("reserveMonths", "Reserva objetivo (meses)", state.settings.reserveMonths, { type: "number", step: "1", min: 0 })}
  </form>`;
  document.getElementById("drawerFoot").style.display = "flex";
  document.getElementById("drawerFootLeft").innerHTML = "";
  openDrawer();
}
function saveRatesForm() {
  const raw = readEntityForm();
  state.settings.usd = Number(raw.usd) || state.settings.usd;
  state.settings.uf  = Number(raw.uf)  || state.settings.uf;
  state.settings.reserveMonths = Math.max(0, Number(raw.reserveMonths) || 6);
  saveState();
  closeDrawer();
  toast("Tasas actualizadas", "good");
  renderApp();
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if (t) {
    const action = t.dataset.action;
    const id = t.dataset.id;
    const parent = t.dataset.parent;
    const template = t.dataset.template;
    if (action === "open-palette")   { openPalette(); return; }
    if (action === "close-drawer")   { closeDrawer(); return; }
    if (action === "drawer-save")    {
      if (decisionDraft) { saveDecision(); return; }
      if (!crudCtx) return;
      if (crudCtx.entityType === "__rates__") saveRatesForm();
      else saveEntityForm();
      return;
    }
    if (action === "entity-delete")  { deleteEntityFromDrawer(); return; }
    if (action === "decision-delete"){ deleteDecision(); return; }
    if (action === "toggle-advanced"){
      const wrap = t.closest(".advanced-toggle");
      if (!wrap) return;
      const sec = wrap.nextElementSibling;
      if (!sec || !sec.classList.contains("advanced-section")) return;
      const open = sec.classList.toggle("open");
      t.textContent = open ? "Ocultar detalle avanzado ↑" : "Mostrar detalle avanzado ↓";
      return;
    }
    if (action === "close-confirm")  { closeConfirm(); return; }
    if (action === "export-json")    { exportJSON(); return; }
    if (action === "open-settings")  { openRatesForm(); return; }
    if (action === "goto-goals")     { goView("goals"); return; }
    if (action === "goto-cashflow")  { goView("cashflow"); return; }
    if (action === "new-tcMovement") { openEntityForm("tcMovement", null, t.dataset.parent); return; }
    if (action === "edit-tcMovement"){ openEntityForm("tcMovement", id, t.dataset.parent); return; }
    if (action === "new-asset")      { openEntityForm("asset"); return; }
    if (action === "edit-asset")     { openEntityForm("asset", id); return; }
    if (action === "new-liability")  { openEntityForm("liability"); return; }
    if (action === "edit-liability") { openEntityForm("liability", id); return; }
    if (action === "new-income")     { openEntityForm("income"); return; }
    if (action === "edit-income")    { openEntityForm("income", id); return; }
    if (action === "new-expense")    { openEntityForm("expense"); return; }
    if (action === "edit-expense")   { openEntityForm("expense", id); return; }
    if (action === "new-goal")       { openEntityForm("goal"); return; }
    if (action === "edit-goal")      { openEntityForm("goal", id); return; }
    if (action === "new-business")   { openEntityForm("business"); return; }
    if (action === "edit-business")  { openEntityForm("business", id); return; }
    if (action === "select-business"){ state.ui.businessId = id; saveState(); renderApp(); return; }
    if (action === "new-product")    { openEntityForm("product", null, id); return; }
    if (action === "edit-product")   { openEntityForm("product", id, parent); return; }
    if (action === "new-fixedCost")  { openEntityForm("fixedCost", null, id); return; }
    if (action === "edit-fixedCost") { openEntityForm("fixedCost", id, parent); return; }
    if (action === "new-partner")    { openEntityForm("partner", null, id); return; }
    if (action === "edit-partner")   { openEntityForm("partner", id, parent); return; }
    if (action === "open-decision")  { openDecision(template, id); return; }
  }
  // Nav buttons
  const nav = e.target.closest("[data-view]");
  if (nav) { goView(nav.dataset.view); return; }
  // Palette items
  const pi = e.target.closest("[data-palette-idx]");
  if (pi) { paletteRun(parseInt(pi.dataset.paletteIdx)); return; }
  // Backdrops
  if (e.target.id === "drawerBackdrop") { closeDrawer(); return; }
  if (e.target.id === "paletteBackdrop") { closePalette(); return; }
});

document.getElementById("confirmOk").addEventListener("click", () => { if (confirmCallback) confirmCallback(); });

document.getElementById("paletteInput").addEventListener("input", () => { paletteIdx = 0; renderPalette(); });

document.addEventListener("keydown", e => {
  // Cmd-K / Ctrl-K
  if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) {
    e.preventDefault();
    openPalette();
    return;
  }
  if (e.key === "Escape") {
    if (document.getElementById("palette").classList.contains("open")) { closePalette(); return; }
    if (document.getElementById("drawer").classList.contains("open"))  { closeDrawer(); return; }
    if (document.getElementById("confirmBg").classList.contains("open")) { closeConfirm(); return; }
  }
  // Palette navigation
  if (document.getElementById("palette").classList.contains("open")) {
    if (e.key === "ArrowDown") { e.preventDefault(); paletteIdx = Math.min(paletteVisible.length - 1, paletteIdx + 1); renderPalette(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); paletteIdx = Math.max(0, paletteIdx - 1); renderPalette(); }
    else if (e.key === "Enter") { e.preventDefault(); paletteRun(paletteIdx); }
    return;
  }
  // 1-6 navigation cuando no estás en input
  const inField = ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName);
  if (!inField && /^[1-6]$/.test(e.key)) {
    e.preventDefault();
    const m = MODULES[parseInt(e.key) - 1];
    if (m) goView(m.id);
  }
});

/* Drag&drop JSON import */
let dragCount = 0;
document.addEventListener("dragenter", e => {
  if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files")) {
    e.preventDefault();
    dragCount++;
    document.getElementById("dropZone").classList.add("open");
  }
});
document.addEventListener("dragleave", e => {
  dragCount--;
  if (dragCount <= 0) { dragCount = 0; document.getElementById("dropZone").classList.remove("open"); }
});
document.addEventListener("dragover", e => { e.preventDefault(); });
document.addEventListener("drop", e => {
  e.preventDefault();
  dragCount = 0;
  document.getElementById("dropZone").classList.remove("open");
  const f = e.dataTransfer?.files?.[0];
  if (!f) return;
  if (!f.name.toLowerCase().endsWith(".json")) {
    toast("Solo se acepta JSON de backup", "bad");
    return;
  }
  importFile(f);
});

/* ============================================================
   INIT
   ============================================================ */
function init() {
  const r = loadState();
  if (r.migrated) toast("Datos " + r.source + " migrados a v0.6", "good");
  if (r.error) toast("Error al cargar: " + r.error + " (cargando demo)", "bad");
  renderApp();
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}

init();

</script>
